<title>Planejador de Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen work tool. Header (projeto, abas, quem está online, status de salvamento) → barra de ferramentas da aba → área de trabalho.
   Cronograma = grade EAP + Gantt lado a lado com painel lateral da tarefa; Pagamentos = livro de parcelas editável; Fluxo = relatório mensal. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f0f2f5; --surface-3:#e4e8ee; --line:#e2e6eb; --line-2:#cbd1da;
  --fg:#131922; --muted:#525c6b; --faint:#8790a0;
  --accent:#243249; --accent-h:#18233a; --on-accent:#ffffff; --accent-soft:#e2e8f1; --sel:#edf1f7;
  --sum:#1d2532; --bar:#4a5e7d; --bar-2:#243249; --link:#9aa3b1; --nonwork:#f5f6f8;
  --mat:#2a78d6; --mo:#eb6834; --eq:#1baf7a; --ter:#c98a00; --rec:#0a8a3a; --crit:#cf3a2c; --mat-soft:#e3eefb; --mo-soft:#fdebe3; --eq-soft:#dcf3ea; --ter-soft:#fbf0d6;
  --warn:#8f5600; --warn-bg:#fcf0d8; --danger:#b42318; --danger-bg:#fde8e5; --ok:#1d7a45;
  --scrim:rgba(13,19,30,.42); --shadow:rgba(15,23,42,.10);
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rowh:34px;
}

  --sum:#d8dde6; --bar:#86a6dc; --bar-2:#8fb0f0; --link:#5f6878; --nonwork:#13171d;

  --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.45);

  --warn:#f0b04a; --warn-bg:#36290f; --danger:#f2867a; --danger-bg:#3a1a16; --ok:#5fc48b;

  --fg:#131922; --muted:#525c6b; --faint:#8790a0;

  --scrim:rgba(13,19,30,.42); --shadow:rgba(15,23,42,.10); color-scheme:light}

  --bg:#f2f4f1; --surface:#ffffff; --surface-2:#eef1ed; --surface-3:#e3e8e2; --line:#e0e5df; --line-2:#c9d1c8;
  --fg:#152019; --muted:#536059; --faint:#848f88; --accent:#1c6a52; --accent-h:#145441; --on-accent:#ffffff; --accent-soft:#d8ebe2; --sel:#e8f2ed;
  --sum:#24302a; --bar:#2a7a5f; --bar-2:#1c6a52; --link:#8a958d; --nonwork:#f3f5f1; --scrim:rgba(16,24,19,.42); --shadow:rgba(20,32,25,.12); --mat:#2a78d6; --mo:#eb6834; --eq:#1baf7a; --ter:#c98a00; --rec:#0a8a3a; --crit:#cf3a2c; --mat-soft:#e3eefb; --mo-soft:#fdebe3; --eq-soft:#dcf3ea; --ter-soft:#fbf0d6; --warn:#8f5600; --warn-bg:#fcf0d8; --danger:#b42318; --danger-bg:#fde8e5; --ok:#1d7a45; color-scheme:light}
:root[data-pal="oceano"]{
  --bg:#edf2f7; --surface:#ffffff; --surface-2:#e8eff6; --surface-3:#d9e4ef; --line:#dce5ee; --line-2:#c1cfdd;
  --fg:#0e1c2b; --muted:#4a5c6f; --faint:#8092a5; --accent:#0d5a7f; --accent-h:#094866; --on-accent:#ffffff; --accent-soft:#d4e6f2; --sel:#e4eef7;
  --sum:#12253a; --bar:#17738f; --bar-2:#0d5a7f; --link:#8b9bab; --nonwork:#f0f4f8; --scrim:rgba(10,24,38,.42); --shadow:rgba(12,30,50,.12); --mat:#2a78d6; --mo:#eb6834; --eq:#1baf7a; --ter:#c98a00; --rec:#0a8a3a; --crit:#cf3a2c; --mat-soft:#e3eefb; --mo-soft:#fdebe3; --eq-soft:#dcf3ea; --ter-soft:#fbf0d6; --warn:#8f5600; --warn-bg:#fcf0d8; --danger:#b42318; --danger-bg:#fde8e5; --ok:#1d7a45; color-scheme:light}
:root[data-pal="branco"]{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f6f6f7; --surface-3:#ececee; --line:#ebebed; --line-2:#d5d5da;
  --fg:#111114; --muted:#5a5a63; --faint:#919199; --accent:#18181b; --accent-h:#000000; --on-accent:#ffffff; --accent-soft:#ececef; --sel:#f3f3f5;
  --sum:#18181b; --bar:#45454d; --bar-2:#18181b; --link:#a0a0a8; --nonwork:#f7f7f8; --scrim:rgba(0,0,0,.38); --shadow:rgba(0,0,0,.08); --mat:#2a78d6; --mo:#eb6834; --eq:#1baf7a; --ter:#c98a00; --rec:#0a8a3a; --crit:#cf3a2c; --mat-soft:#e3eefb; --mo-soft:#fdebe3; --eq-soft:#dcf3ea; --ter-soft:#fbf0d6; --warn:#8f5600; --warn-bg:#fcf0d8; --danger:#b42318; --danger-bg:#fde8e5; --ok:#1d7a45; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px}
.ic{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 12px}
/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ident{display:flex;align-items:center;gap:12px;flex:1 1 300px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--fg);display:grid;place-items:center;flex:none}
.mark svg rect{fill:var(--bg)}
.pj{min-width:0;flex:1;display:flex;flex-direction:column}
.pj-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;padding:0;cursor:pointer;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;width:max-content}
.pj-btn:hover{color:var(--fg)}
#p-nome{font:700 20px/1.2 var(--f-ui);font-stretch:108%;letter-spacing:-.01em;border:1px solid transparent;background:transparent;border-radius:6px;padding:1px 6px;margin-left:-7px;width:100%;max-width:620px;min-width:0}
#p-nome:hover{border-color:var(--line)}#p-nome:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px var(--shadow)}
.right{display:flex;align-items:center;gap:12px;margin-left:auto}
.peers{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.peers .stack{display:flex}
.peers img{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-left:-7px;background:var(--surface-3)}
.peers img:first-child{margin-left:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.saving i{background:var(--warn)}
.sync.local i{background:var(--faint)}
.sync.err i{background:var(--danger)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.banner .btn{margin-left:auto}

/* toolbar + buttons */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.icons{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--surface)}
.icons .btn{border:0;border-radius:0;border-right:1px solid var(--line)}
.icons .btn:last-child{border-right:0}
.spacer{flex:1}
.btn{height:32px;padding:0 11px;border:1px solid var(--line-2);background:var(--surface);border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn:disabled{opacity:.42;cursor:default;background:var(--surface)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;padding:2px;background:var(--surface-2);width:max-content;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:5px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
.pinfo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line-2);border-radius:7px;height:32px;padding:0 10px;background:transparent;cursor:pointer}
.pinfo:hover{border-style:solid;color:var(--fg)}
body.ro .w{display:none!important}

/* cronograma */
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.split{flex:1;min-height:0;position:relative;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.gridpane{flex:0 0 min(60%,846px);overflow:auto;border-right:1px solid var(--line-2)}
.ganttpane{flex:1;min-width:0;overflow:auto;position:relative}
@media (max-width:760px){.split{flex-direction:column}.gridpane{flex:0 0 52%;border-right:0;border-bottom:1px solid var(--line-2)}}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.grid th{position:sticky;top:0;z-index:2;height:44px;background:var(--surface-2);font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 8px;white-space:nowrap;background-image:linear-gradient(var(--line-2),var(--line-2));background-size:100% 1px;background-position:bottom;background-repeat:no-repeat}
.grid td{height:var(--rowh);padding:0 4px;white-space:nowrap;background-image:linear-gradient(var(--line),var(--line));background-size:100% 1px;background-position:bottom;background-repeat:no-repeat}
.grid tr.sum td{font-weight:600;background-color:var(--surface-2)}
.grid tr.sum.l0 td{background-color:var(--surface-3)}
.grid tr.sum td.c-nome input{font-weight:650}
.grid tr:hover td{background-color:var(--sel)}
.grid tr.sel td{background-color:var(--accent-soft)}
.grid td.c-id{color:var(--faint);text-align:right;padding-right:8px;font-size:11.5px;position:relative}
.grid td.c-id img{width:18px;height:18px;border-radius:50%;vertical-align:middle;border:2px solid var(--surface)}
.grid td.c-eap{color:var(--muted);font-family:var(--f-num);font-size:11.5px}
.grid .ro{padding:0 8px;color:var(--muted)}
.grid input{width:100%;height:26px;border:1px solid transparent;background:transparent;border-radius:5px;padding:0 6px;font-size:13px}
.grid input:hover:not(:disabled){border-color:var(--line-2);background:var(--surface)}
.grid input:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.grid input[type=number]{text-align:right;font-family:var(--f-num);font-size:12.5px}
.grid input.dt{font-family:var(--f-num);font-size:12px}
.grid input.pred{font-family:var(--f-num);font-size:12px}
.nm{display:flex;align-items:center;gap:2px;padding-left:calc(var(--lv) * 16px)}
.tw{width:18px;height:18px;border:0;background:transparent;cursor:pointer;color:var(--muted);flex:none;border-radius:4px;display:grid;place-items:center;padding:0}
.tw:hover{background:var(--surface-3)}
.tw.closed .ic{transform:rotate(-90deg)}
.tw-sp{width:18px;flex:none;display:grid;place-items:center;color:var(--faint)}
.money{border:0;background:transparent;cursor:pointer;width:100%;padding:3px 8px;border-radius:5px;color:var(--fg);display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.money:hover{background:var(--surface)}
.money.zero{color:var(--faint)}
.mini{display:flex;height:3px;width:56px;border-radius:2px;overflow:hidden;gap:1px;background:var(--line)}
.mini i{display:block;height:100%}
.gh{position:sticky;top:0;z-index:3;height:44px;background:var(--surface-2);background-image:linear-gradient(var(--line-2),var(--line-2));background-size:100% 1px;background-position:bottom;background-repeat:no-repeat}
.gh svg,.gb svg{display:block}
.gb{position:relative}
.gb .leaf{cursor:grab}
.gb .leaf.dragging{cursor:grabbing}
.gb .rs{cursor:ew-resize}
body.ro .gb .leaf{cursor:pointer}
.gtip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font:500 12px var(--f-num);padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:4;box-shadow:0 4px 14px var(--shadow)}
.legend-g{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);padding:0 2px}
.legend-g span{display:inline-flex;align-items:center;gap:6px}
.legend-g code{font-family:var(--f-num);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--fg)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}

/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);border-left:1px solid var(--line-2);box-shadow:-16px 0 36px var(--shadow);overflow:auto;z-index:6;display:flex;flex-direction:column}
.dh{position:sticky;top:0;z-index:2;background:var(--surface);padding:14px 18px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dh-row{display:flex;gap:10px;align-items:flex-start}
.dh .t{flex:1;min-width:0}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dh input{width:100%;font:650 18px/1.25 var(--f-ui);font-stretch:106%;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin-left:-7px;background:transparent}
.dh input:focus{border-color:var(--accent);outline:none}
.dmeta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.dtabs{display:flex;gap:18px}
.dtabs button{border:0;background:transparent;padding:8px 0 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.dtabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.sec{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sec h3{margin:0;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lbl,.row2 label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.inp{height:34px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);padding:0 9px;font-size:13px;width:100%;color:var(--fg)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.inp:disabled{background:var(--surface-2);color:var(--muted)}
.hint{font-size:12px;color:var(--faint);margin:0;line-height:1.45}
.links{display:flex;flex-direction:column}
.lk{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.lk:first-child{border-top:0}
.lk .k{color:var(--faint);font-family:var(--f-num);font-size:11.5px;min-width:42px}
.lk .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .ty{font-size:12px;color:var(--muted);white-space:nowrap}
.addlk{display:grid;grid-template-columns:1fr 156px 64px auto;gap:6px;align-items:end}
@media (max-width:520px){.addlk{grid-template-columns:1fr 1fr}}
.tot3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot3 div{display:flex;flex-direction:column;gap:2px;padding:9px 11px;background:var(--surface-2);border-radius:8px;min-width:0}
.tot3 span:first-child{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}

.ledger input.n{font-family:var(--f-num);text-align:right;width:130px}

/* fluxo de caixa */

/* seletor de data */
.dp{position:fixed;z-index:36;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 14px 40px var(--shadow);padding:8px;width:256px;user-select:none}

/* menus, modais, toast */
.menu{position:absolute;z-index:25;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 14px 40px var(--shadow);padding:6px;min-width:280px;max-width:calc(100vw - 32px);max-height:70vh;overflow:auto}

<script>
/* ===================== utilidades ===================== */
const DAY=86400000;
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const iso2d=s=>{if(!s)return null;const p=String(s).slice(0,10).split('-').map(Number);if(p.length<3||p.some(isNaN))return null;return Math.round(Date.UTC(p[0],p[1]-1,p[2])/DAY)};
const d2iso=d=>new Date(d*DAY).toISOString().slice(0,10);
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>{const x=new Date(d*DAY);return pad(x.getUTCDate())+'/'+pad(x.getUTCMonth()+1)+'/'+String(x.getUTCFullYear()).slice(2)};
const DTF=d=>{const x=new Date(d*DAY);return pad(x.getUTCDate())+'/'+pad(x.getUTCMonth()+1)+'/'+x.getUTCFullYear()};
const dow=d=>(((d%7)+7)%7+4)%7;
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESESL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function mkDate(y,mo,d){if(mo<1||mo>12||d<1||d>31||y<1900||y>2200)return undefined;const t=Date.UTC(y,mo-1,d);if(new Date(t).getUTCDate()!==d)return undefined;return Math.round(t/DAY)}
function parseDateBR(v,ref){v=String(v||'').trim();if(!v)return null;let m;const refY=new Date(((ref??null)!=null?ref:Math.floor(Date.now()/DAY))*DAY).getUTCFullYear();
  if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return mkDate(+m[1],+m[2],+m[3]);
  if(m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2}|\d{4}))?$/)){let y=m[3]?+m[3]:refY;if(y<100)y+=2000;return mkDate(y,+m[2],+m[1])}
  if(m=v.match(/^(\d{2})(\d{2})(\d{2}|\d{4})?$/)){let y=m[3]?+m[3]:refY;if(y<100)y+=2000;return mkDate(y,+m[2],+m[1])}
  return undefined}
function readDate(v,ref){const d=parseDateBR(v,ref);if(d===undefined)throw new Error(`Não entendi a data “${v}”. Use dd/mm/aaaa (ex.: 15/03/2027).`);return d}
const ym=d=>{const x=new Date(d*DAY);return x.getUTCFullYear()*12+x.getUTCMonth()};
const ymLabel=k=>MESES[k%12]+'/'+String(Math.floor(k/12)).slice(2);
const ymLong=k=>MESESL[k%12]+' de '+Math.floor(k/12);
const ymStart=k=>Math.round(Date.UTC(Math.floor(k/12),k%12,1)/DAY);
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/DAY);
const BRL0=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brl=v=>BRL0.format(Math.round(v||0));
const brlc=v=>{v=v||0;const a=Math.abs(v),s=v<0?'−':'';if(a>=1e6)return s+'R$ '+(a/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi';if(a>=1e3)return s+'R$ '+(a/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil';return s+brl(a)};
const moneyIn=v=>(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pctTxt=v=>(v||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const pct1=v=>(v||0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const parseNum=s=>{s=String(s??'').replace(/R\$|\s|%/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0};
const parseMoney=s=>{const n=parseNum(s);return n>0?Math.round(n*100)/100:0};
let uidc=0;const nid=()=>Date.now().toString(36)+(uidc++).toString(36)+Math.random().toString(36).slice(2,6);
const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
function deepMerge(a,b){if(!isObj(a)||!isObj(b))return clone(b);const r=clone(a);for(const k in b)r[k]=isObj(b[k])&&isObj(r[k])?deepMerge(r[k],b[k]):clone(b[k]);return r}
function diff(x,y){if(JSON.stringify(x)===JSON.stringify(y))return undefined;if(isObj(x)&&isObj(y)){const r={};for(const k in y){const d=diff(x[k],y[k]);if(d!==undefined)r[k]=d}for(const k in x)if(!(k in y))r[k]=null;return Object.keys(r).length?r:undefined}return clone(y===undefined?null:y)}
const sum=a=>a.reduce((x,y)=>x+y,0);

const ICON={
  plus:'<path d="M8 3v10M3 8h10"/>',diamond:'<path d="M8 2.8 13.2 8 8 13.2 2.8 8z"/>',
  outdent:'<path d="M14 4H7.5M14 8h-4.5M14 12H7.5M5 5.5 2.5 8 5 10.5"/>',indent:'<path d="M14 4H7.5M14 8h-4.5M14 12H7.5M2.5 5.5 5 8l-2.5 2.5"/>',
  up:'<path d="M8 13V3.5M4 7.5l4-4 4 4"/>',down:'<path d="M8 3v9.5M4 8.5l4 4 4-4"/>',
  trash:'<path d="M2.5 4.5h11M6.5 4.5V3h3v1.5M4 4.5l.8 9h6.4l.8-9"/>',undo:'<path d="M5.5 6.5h5a3 3 0 0 1 0 6H8M5.5 6.5 8 4M5.5 6.5 8 9"/>',
  chev:'<path d="M4.5 6.5 8 10l3.5-3.5"/>',x:'<path d="M4 4l8 8M12 4l-8 8"/>',target:'<circle cx="8" cy="8" r="5.2"/><circle cx="8" cy="8" r="1.6"/>',
  search:'<circle cx="7" cy="7" r="4.3"/><path d="m10.2 10.2 3.3 3.3"/>',file:'<path d="M4 1.8h5l3 3v9.4H4z M9 1.8v3h3"/>',
  lock:'<rect x="3.5" y="7" width="9" height="6.5" rx="1.2"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7"/>',cal:'<rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/>',
  link:'<path d="M6.8 9.2l2.4-2.4M7.2 4.6l1-1a2.6 2.6 0 0 1 3.7 3.7l-1 1M8.8 11.4l-1 1a2.6 2.6 0 0 1-3.7-3.7l1-1"/>',
  clip:'<path d="M10.5 5.5 6 10a1.4 1.4 0 0 0 2 2l5-5a2.8 2.8 0 0 0-4-4L4 8a4.2 4.2 0 0 0 6 6l3.5-3.5"/>',
  check:'<path d="M3.5 8.5 6.5 11.5 12.5 4.5"/>',camera:'<path d="M2.5 5.5h2.2l1.2-1.8h4.2l1.2 1.8h2.2v7.5h-11z"/><circle cx="8" cy="9" r="2.3"/>'
};
const ic=(n,s=16)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]||''}</svg>`;
document.querySelectorAll('[data-ic]').forEach(e=>e.outerHTML=ic(e.dataset.ic));
$('#pj-chev').innerHTML=ic('chev',13);

const FERIADOS_BR=['2026-11-02','2026-11-15','2026-11-20','2026-12-25','2027-01-01','2027-02-08','2027-02-09','2027-03-26','2027-04-21','2027-05-01','2027-05-27','2027-09-07','2027-10-12','2027-11-02','2027-11-15','2027-11-20','2027-12-25','2028-01-01','2028-02-28','2028-02-29','2028-04-14','2028-04-21','2028-05-01','2028-06-15','2028-09-07','2028-10-12','2028-11-02','2028-11-15','2028-11-20','2028-12-25'];
const TIPOS={TI:'Término → Início',II:'Início → Início',TT:'Término → Término',IT:'Início → Término'};
const EN={FS:'TI',SS:'II',FF:'TT',SF:'IT'};
const CATS=[['mat','Material'],['mo','Mão de obra'],['eq','Equipamentos'],['ter','Terceiros e taxas']];
const CATN=Object.fromEntries(CATS);
const BASEN={fisico:'De acordo com o físico (padrão)',inicio:'Prazo a partir do início',termino:'Prazo a partir do término',medicao:'Medição mensal paga depois',mensal:'Fluxo próprio (planilha)'};
const PRAZO_CHIPS=[['0','À vista'],['30','30 dias'],['30/60','30/60'],['30/60/90','30/60/90'],['0/30/60','Entrada + 30/60'],['28/56/84','28/56/84']];
const PAPEIS={admin:'Administrador (tudo)',planejamento:'Planejamento (prazos e avanço)',financeiro:'Financeiro (valores e pagamentos)',campo:'Campo (avanço e comentários)',leitura:'Somente leitura'};
const PODE={admin:['prazo','fin','pago','exec','proj'],planejamento:['prazo','exec','proj'],financeiro:['fin','pago'],campo:['exec'],leitura:[]};
const defCat=c=>({valor:0,qtd:0,un:'',pu:0,modo:'fisico',base:c==='mat'?'inicio':'termino',prazo:c==='mat'?'30':'0',offset:15,parcelas:[],pagos:[]});
const defFin=()=>Object.fromEntries(CATS.map(([c])=>[c,defCat(c)]));
function parsePrazo(str){const v=String(str??'').trim().toLowerCase();if(!v||/vista|^av$/.test(v))return[0];
  const parts=v.replace(/dias?|dd|d/g,' ').split(/[\/;,+\s]+/).filter(Boolean);
  if(!parts.length||parts.some(x=>!/^-?\d+$/.test(x)))throw new Error(`Não entendi o prazo “${str}”. Escreva os dias separados por barra, ex.: 30/60/90 (0 = à vista).`);
  if(parts.length>60)throw new Error('No máximo 60 parcelas.');return parts.map(Number)}

function localDB(){
  let docs={};try{docs=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}}catch(e){}
  const subs=new Set();const persist=()=>{try{localStorage.setItem(LKEY,JSON.stringify(docs))}catch(e){toast('O navegador ficou sem espaço para salvar.')}};
  const snap=p=>({id:p.split('/').pop(),exists:p in docs,data:()=>clone(docs[p]),metadata:{fromCache:false,hasPendingWrites:false}});
  const col=c=>{const n=c.split('/').length+1;return Object.keys(docs).filter(p=>p.startsWith(c+'/')&&p.split('/').length===n).sort().map(snap)};
  const notify=()=>subs.forEach(s=>s());let nt=0;const later=()=>{if(!nt)nt=setTimeout(()=>{nt=0;notify()},0)};
  try{window.addEventListener('storage',e=>{if(e.key===LKEY){try{docs=JSON.parse(e.newValue||'{}')||{}}catch(_){}notify()}})}catch(e){}
  const docRef=p=>({path:p,id:p.split('/').pop(),get:async()=>snap(p),
    set:async b=>{docs[p]=clone(b);persist();later()},
    update:async b=>{if(!(p in docs))throw{code:'invalid_argument',message:'missing'};docs[p]=deepMerge(docs[p],b);persist();later()},
    delete:async()=>{delete docs[p];persist();later()},
    onSnapshot:fn=>{const s=()=>fn(snap(p));subs.add(s);setTimeout(s,0);return()=>subs.delete(s)}});
  const colRef=c=>({path:c,doc:id=>docRef(c+'/'+id),get:async()=>{const d=col(c);return{docs:d,size:d.length,empty:!d.length}},
    onSnapshot:fn=>{const s=()=>{const d=col(c);fn({docs:d,size:d.length,empty:!d.length})};subs.add(s);setTimeout(s,0);return()=>subs.delete(s)}});
  return{doc:docRef,collection:colRef,_all:()=>docs};
}

function write(path,op,body){const prev=pend.get(path);let next;

  else next=prev&&prev.op!=='delete'?{op:prev.op,body:deepMerge(prev.body,body)}:{op:'update',body:clone(body)};
  pend.set(path,next);pump(path)}
async function pump(path){if(running.has(path))return;running.add(path);renderSync();
  while(pend.has(path)){const w=pend.get(path);pend.delete(path);inflight.set(path,w);const ref=STORE.doc(path);
    for(let tent=0;tent<2;tent++){try{if(w.op==='delete')await ref.delete();else if(w.op==='set')await ref.set(w.body);else await ref.update(w.body);syncErr=false;break}
      catch(e){const c=e&&e.code;
        if(c==='unavailable'&&tent===0){await new Promise(r=>setTimeout(r,400+Math.random()*600));continue}
        if(c==='invalid_argument'&&w.op==='update'){break}
        if(c==='invalid_argument'){setRO(true);toast('Sua conta só pode ver este planejador. Peça ao dono acesso de edição.');break}
        if(c==='quota_exceeded'){toast('O espaço do banco de dados acabou. Exclua projetos antigos para liberar espaço.');syncErr=true;break}

const FIELDN={nome:'nome',dur:'duração',snet:'início',preds:'predecessoras',exec:'% executado',resp:'responsável',fin:'financeiro'};
function describe(a,b){const out=[];if(!a)return[`Criou o projeto “${b.nome}”`];
  const am=new Map(a.tasks.map(t=>[t.id,t])),bm=new Map(b.tasks.map(t=>[t.id,t]));
  b.tasks.forEach(t=>{const o=am.get(t.id);if(!o){out.push(`Criou a tarefa “${t.nome}”`);return}
    const ch=[];for(const k of ['nome','dur','snet','preds','exec','resp']){if(JSON.stringify(o[k])!==JSON.stringify(t[k])){
      if(k==='exec')ch.push(`% executado ${o.exec}% → ${t.exec}%`);else if(k==='dur')ch.push(`duração ${o.dur} → ${t.dur} dias`);else if(k==='nome')ch.push(`nome “${o.nome}” → “${t.nome}”`);else if(k==='resp')ch.push(`responsável → ${t.resp||'ninguém'}`);else ch.push(FIELDN[k])}}
    CATS.forEach(([c,l])=>{const x=o.fin[c],y=t.fin[c];if(x.valor!==y.valor)ch.push(`${l.toLowerCase()} ${brl(x.valor)} → ${brl(y.valor)}`);
      else if(JSON.stringify(x.pagos)!==JSON.stringify(y.pagos)){const d=y.pagos.length-x.pagos.length;ch.push(d>0?`registrou pagamento de ${l.toLowerCase()}`:d<0?`desmarcou pagamento de ${l.toLowerCase()}`:`ajustou pagamento de ${l.toLowerCase()}`)}
      else if(JSON.stringify(x)!==JSON.stringify(y))ch.push(`condição de pagamento de ${l.toLowerCase()}`)});
    if(o.nivel!==t.nivel)ch.push('nível na EAP');
    if(ch.length)out.push(`“${t.nome}”: ${ch.join(', ')}`)});
  am.forEach((t,id)=>{if(!bm.has(id))out.push(`Excluiu a tarefa “${t.nome}”`)});
  if(a.nome!==b.nome)out.push(`Renomeou o projeto para “${b.nome}”`);
  if(a.inicio!==b.inicio||a.cal!==b.cal||JSON.stringify(a.feriados)!==JSON.stringify(b.feriados))out.push('Mudou o calendário do projeto');
  if(JSON.stringify(a.reajuste)!==JSON.stringify(b.reajuste))out.push('Mudou o reajuste (INCC)');
  if(a.tasks.map(t=>t.id).join()!==b.tasks.map(t=>t.id).join()&&!out.some(x=>/Criou|Excluiu/.test(x)))out.push('Reordenou tarefas na EAP');
  return out}

let HOL=new Set();
const isWork=d=>state.cal==='corridos'||(dow(d)!==0&&dow(d)!==6&&!HOL.has(d));
const nextWork=d=>{let g=0;while(!isWork(d)&&g++<400)d++;return d};
const prevWork=d=>{let g=0;d--;while(!isWork(d)&&g++<400)d--;return d};
function addWork(d,n){d=nextWork(d);while(n>0){d=nextWork(d+1);n--}while(n<0){d=prevWork(d);n++}return d}
function countWork(a,b){let n=0;for(let d=a;d<b;d++)if(isWork(d))n++;return n}
function structure(){
  const T=state.tasks,n=T.length;const parent=[],sum=[],end=[],eap=[],idx={},stack=[],cnt=[];
  T.forEach((t,i)=>{idx[t.id]=i;
    while(stack.length&&T[stack[stack.length-1]].nivel>=t.nivel)stack.pop();
    parent[i]=stack.length?stack[stack.length-1]:-1;stack.push(i);
    sum[i]=i+1<n&&T[i+1].nivel>t.nivel;
    let j=i+1;while(j<n&&T[j].nivel>t.nivel)j++;end[i]=j;
    cnt.length=t.nivel+1;for(let k=0;k<t.nivel;k++)cnt[k]=cnt[k]||1;cnt[t.nivel]=(cnt[t.nivel]||0)+1;eap[i]=cnt.join('.')});
  ST={parent,sum,end,eap,idx}}
const byId=id=>state.tasks[ST.idx[id]];
const leavesOf=i=>{if(!ST.sum[i])return[i];const r=[];for(let j=i+1;j<ST.end[i];j++)if(!ST.sum[j])r.push(j);return r};
function schedule(){
  HOL=new Set(state.feriados.map(iso2d).filter(x=>x!=null));
  const T=state.tasks,n=T.length,S=new Array(n),E=new Array(n);const p0=iso2d(state.inicio)??today();
  const leaves=[],deps={};
  for(let i=0;i<n;i++){if(ST.sum[i])continue;leaves.push(i);const list=[];
    for(let c=i;c!==-1;c=ST.parent[c])for(const p of T[c].preds){const ti=ST.idx[p.id];if(ti==null)continue;const lv=leavesOf(ti);if(lv.includes(i))continue;list.push({lv,tipo:p.tipo||'TI',lag:+p.lag||0})}
    deps[i]=list}
  const indeg={},out={};leaves.forEach(i=>{indeg[i]=0;out[i]=[]});
  leaves.forEach(i=>{const seen=new Set();deps[i].forEach(d=>d.lv.forEach(j=>{if(!seen.has(j)){seen.add(j);indeg[i]++;out[j].push(i)}}))});
  const q=leaves.filter(i=>indeg[i]===0),order=[];while(q.length){const i=q.shift();order.push(i);out[i].forEach(k=>{if(--indeg[k]===0)q.push(k)})}
  const cycle=order.length<leaves.length;if(cycle){const s=new Set(order);leaves.forEach(i=>{if(!s.has(i))order.push(i)})}
  const done=new Set();
  for(const i of order){const t=T[i],D=t.dur;let s=Math.max(p0,iso2d(t.snet)??p0);
    for(const d of deps[i]){if(!d.lv.every(j=>done.has(j)))continue;let gS=Infinity,gE=-Infinity;d.lv.forEach(j=>{gS=Math.min(gS,S[j]);gE=Math.max(gE,E[j])});let r;
      if(d.tipo==='TI')r=addWork(gE,d.lag);else if(d.tipo==='II')r=addWork(gS,d.lag);else if(d.tipo==='TT')r=addWork(addWork(gE,d.lag),-D);else r=addWork(addWork(gS,d.lag),-D);
      s=Math.max(s,r)}
    s=nextWork(s);S[i]=s;E[i]=D>0?addWork(s,D):s;done.add(i)}
  // caminho crítico: passagem de volta
  let pEnd=-Infinity;leaves.forEach(i=>pEnd=Math.max(pEnd,E[i]));const LE={};leaves.forEach(i=>LE[i]=pEnd);
  if(!cycle){for(let k=order.length-1;k>=0;k--){const s=order[k],Ds=T[s].dur;const LEs=LE[s],LSs=Ds>0?addWork(LEs,-Ds):LEs;
    for(const d of deps[s])d.lv.forEach(j=>{const Dj=T[j].dur;let lim;
      if(d.tipo==='TI')lim=addWork(LSs,-d.lag);else if(d.tipo==='TT')lim=addWork(LEs,-d.lag);
      else if(d.tipo==='II'){const ls=addWork(LSs,-d.lag);lim=Dj>0?addWork(ls,Dj):ls}else{const ls=addWork(LEs,-d.lag);lim=Dj>0?addWork(ls,Dj):ls}
      if(lim<LE[j])LE[j]=lim})}}
  for(let i=n-1;i>=0;i--){if(!ST.sum[i])continue;let a=Infinity,b=-Infinity;for(let j=i+1;j<ST.end[i];j++)if(!ST.sum[j]){a=Math.min(a,S[j]);b=Math.max(b,E[j])}if(a===Infinity){a=p0;b=p0}S[i]=a;E[i]=b}
  const R={cycle,S:{},E:{},F:{},D:{},folga:{},crit:{}};
  T.forEach((t,i)=>{R.S[t.id]=S[i];R.E[t.id]=E[i];R.F[t.id]=E[i]>S[i]?prevWork(E[i]):S[i];R.D[t.id]=ST.sum[i]?countWork(S[i],E[i]):t.dur;
    if(!ST.sum[i]&&!cycle){const f=LE[i]>=E[i]?countWork(E[i],LE[i]):-countWork(LE[i],E[i]);R.folga[t.id]=f;R.crit[t.id]=f<=0}});
  T.forEach((t,i)=>{if(ST.sum[i])R.crit[t.id]=leavesOf(i).some(j=>R.crit[T[j].id])});
  return R}

function parsePreds(str,selfId,tasks){
  tasks=tasks||state.tasks;const out=[];const parts=String(str||'').split(/[;,]/).map(s=>s.trim()).filter(Boolean);
  for(const p of parts){const m=p.match(/^(\d+)\s*(TI|II|TT|IT|FS|SS|FF|SF)?\s*(?:([+\-−])\s*(\d+)\s*d?)?$/i);
    if(!m)throw new Error(`Não entendi a predecessora “${p}”. Exemplos: 3 · 5II+2 · 7TT-1`);
    const row=+m[1],t=tasks[row-1];if(!t)throw new Error(`A linha ${row} não existe.`);
    if(t.id===selfId)throw new Error('Uma tarefa não pode ser predecessora dela mesma.');
    let tipo=(m[2]||'TI').toUpperCase();tipo=EN[tipo]||tipo;const lag=m[3]?(m[3]==='+'?1:-1)*+m[4]:0;
    if(!out.some(o=>o.id===t.id))out.push({id:t.id,tipo,lag})}
  return out}
const lagTxt=l=>l?(l>0?'+':'−')+Math.abs(l)+'d':'';
function predText(t){return t.preds.filter(p=>ST.idx[p.id]!=null).map(p=>{const n=ST.idx[p.id]+1,tp=p.tipo||'TI',lag=+p.lag||0;return n+((tp!=='TI'||lag)?tp:'')+lagTxt(lag)}).join('; ')}

function parcData(t,p){const S=SC.S[t.id],F=SC.F[t.id];if(p.ref==='fixa')return iso2d(p.data)??S;return(p.ref==='inicio'?S:F)+(+p.offset||0)}
function pagamentos(t){
  if(PAYC.has(t.id))return PAYC.get(t.id);
  const out=[];const i=ST.idx[t.id];if(i==null||ST.sum[i]){PAYC.set(t.id,out);return out}
  const S=SC.S[t.id],E=SC.E[t.id],F=SC.F[t.id],D=t.dur;
  for(const [c] of CATS){const f=t.fin[c];if(!f||!f.valor)continue;const pg=new Map(f.pagos.map(p=>[p.i,p]));
    const push=o=>{o.c=c;o.pago=pg.get(o.i)||null;out.push(o)};
    if(f.modo==='medicao'||f.modo==='fisico'){const fis=f.modo==='fisico';const off=fis?0:+f.offset||0;
      if(D===0)push({d:(fis?ymStart(ym(S)+1)-1:S)+off,v:f.valor,pct:100,med:ym(S),i:0,n:1,kind:'med',fis});
      else{const m=new Map();for(let d=S;d<E;d++)if(isWork(d)){const k=ym(d);m.set(k,(m.get(k)||0)+1)}let k2=0;
        m.forEach((n,k)=>push({d:ymStart(k+1)-1+off,v:f.valor*n/D,pct:n/D*100,med:k,share:n/D,i:k2++,n:m.size,kind:'med',fis}))}}
    else if(f.modo==='mensal'){const S0=ym(S);const ks=Object.keys(f.mens).map(Number).filter(r=>+f.mens[r]).sort((a,b)=>a-b);ks.forEach(r=>{const v=+f.mens[r];push({d:ymStart(S0+r+1)-1,v,pct:f.valor?v/f.valor*100:0,i:1000+r,n:ks.length,kind:'mensal',mk:S0+r})})}
    else if(f.modo==='cond'){const offs=prazoSafe(f.prazo),base=f.base==='inicio'?S:F,n=offs.length;let acc=0;
      offs.forEach((o,k)=>{const pct=k===n-1?Math.round((100-acc)*1e4)/1e4:Math.round(1e6/n)/1e4;acc+=pct;push({d:base+o,v:f.valor*pct/100,pct,i:k,n,kind:'cond',off:o})})}
    else f.parcelas.forEach((p,j)=>push({d:parcData(t,p),v:f.valor*(+p.pct||0)/100,pct:+p.pct||0,i:j,n:f.parcelas.length,ref:p.ref,off:+p.offset||0,kind:'manual'}))}
  PAYC.set(t.id,out);return out}
function pagamentosDe(i){const r=[];leavesOf(i).forEach(j=>r.push(...pagamentos(state.tasks[j])));return r}
function custo(i){const r={tot:0};CATS.forEach(([c])=>r[c]=0);leavesOf(i).forEach(j=>{const f=state.tasks[j].fin;CATS.forEach(([c])=>{r[c]+=f[c].valor||0;r.tot+=f[c].valor||0})});return r}
function pagoDe(i){let p=0;leavesOf(i).forEach(j=>{const f=state.tasks[j].fin;CATS.forEach(([c])=>f[c].pagos.forEach(x=>p+=+x.valor||0))});return p}
function setParcDate(t,c,j,d){const p=t.fin[c].parcelas[j];if(d==null)return;if(p.ref==='fixa')p.data=d2iso(d);else p.offset=d-(p.ref==='inicio'?SC.S[t.id]:SC.F[t.id])}
function setParcValor(t,c,j,v){const f=t.fin[c];const vals=f.parcelas.map(p=>f.valor*(+p.pct||0)/100);vals[j]=v;const tot=sum(vals);
  if(tot<=0){f.parcelas[j].pct=0;return}f.valor=Math.round(tot*100)/100;if(f.qtd>0)f.pu=Math.round(f.valor/f.qtd*100)/100;let acc=0;f.parcelas.forEach((p,k)=>{p.pct=k===f.parcelas.length-1?Math.round((100-acc)*1e4)/1e4:Math.round(vals[k]/tot*1e6)/1e4;acc+=p.pct})}
function ensureManual(t,c){const f=t.fin[c];if(f.modo==='manual')return;const ps=pagamentos(t).filter(p=>p.c===c);const base=f.base==='inicio'?'inicio':'termino';const bd=base==='inicio'?SC.S[t.id]:SC.F[t.id];
  let acc=0;f.parcelas=ps.map((p,k)=>{const pct=k===ps.length-1?Math.round((100-acc)*1e4)/1e4:Math.round(p.pct*1e4)/1e4;acc+=pct;return{pct,ref:base,offset:p.d-bd}});f.base=base;f.modo='manual';PAYC.delete(t.id)}
function setPago(t,c,i,on,data,valor){const f=t.fin[c];f.pagos=f.pagos.filter(p=>p.i!==i);if(on)f.pagos.push({i,data,valor:Math.round((+valor||0)*100)/100});f.pagos.sort((a,b)=>a.i-b.i)}
function setValor(f,v){f.valor=Math.round(v*100)/100;if(f.qtd>0)f.pu=Math.round(f.valor/f.qtd*100)/100}
function setQtdPu(f,q,pu){f.qtd=q;f.pu=pu;if(q>0&&pu>0)f.valor=Math.round(q*pu*100)/100}

/* ===================== avanço físico ===================== */
let PESO=null;
function pesos(){if(PESO)return PESO;const T=state.tasks;let tot=0;T.forEach((t,i)=>{if(!ST.sum[i])tot+=sum(CATS.map(([c])=>t.fin[c].valor||0))});
  const byCost=tot>0;PESO={};T.forEach((t,i)=>{if(!ST.sum[i])PESO[t.id]=byCost?sum(CATS.map(([c])=>t.fin[c].valor||0)):Math.max(1,t.dur)});return PESO}
function execAgg(i){const w=pesos();let a=0,b=0;leavesOf(i).forEach(j=>{const t=state.tasks[j];a+=w[t.id]*(t.exec||0);b+=w[t.id]});return b?a/b:0}
function fisicoReal(){const w=pesos();let a=0,b=0;state.tasks.forEach((t,i)=>{if(ST.sum[i])return;a+=w[t.id]*(t.exec||0);b+=w[t.id]});return b?a/b:0}
const fracCal=(S,F,d)=>d<S?0:d>=F?1:(d-S+1)/(F-S+1);
function fisicoPlan(d,src){const w=pesos();let a=0,b=0;state.tasks.forEach((t,i)=>{if(ST.sum[i])return;const ww=w[t.id];let S,F;
  if(src){const x=src[t.id];if(!x)return;S=x[0];F=x[1]}else{S=SC.S[t.id];F=SC.F[t.id]}a+=ww*fracCal(S,F,d)*100;b+=ww});return b?a/b:0}
function statusOf(i){const t=state.tasks[i],id=t.id;const ex=ST.sum[i]?execAgg(i):(t.exec||0);const S=SC.S[id],F=SC.F[id],td=today();
  if(ex>=99.95)return{k:'done',l:'Concluída',ex};
  if(td>F)return{k:'late',l:'Atrasada',ex};
  const exp=td<S?0:fracCal(S,F,td)*100;if(exp-ex>15)return{k:'late',l:'Atrasada',ex};
  if(td<S&&ex<=0)return{k:'todo',l:'A iniciar',ex};return{k:'run',l:'Em andamento',ex}}

function papel(){if(MODE==='arquivo'||MODE==='firebase')return papelArquivo();if(MODE!=='nuvem')return'admin';if(RO)return'leitura';const p=remote.papeis[ME.id];return PAPEIS[p]?p:'admin'}

const dis=k=>pode(k)?'':'disabled';
function kindsChanged(a,b){const ks=new Set();const am=new Map(a.tasks.map(t=>[t.id,t]));
  b.tasks.forEach(t=>{const o=am.get(t.id);if(!o){ks.add('prazo');return}
    if(o.nome!==t.nome||o.dur!==t.dur||o.snet!==t.snet||JSON.stringify(o.preds)!==JSON.stringify(t.preds)||o.resp!==t.resp||o.nivel!==t.nivel)ks.add('prazo');
    if(o.exec!==t.exec)ks.add('exec');
    CATS.forEach(([c])=>{const x=clone(o.fin[c]),y=clone(t.fin[c]);if(JSON.stringify(x.pagos)!==JSON.stringify(y.pagos))ks.add('pago');delete x.pagos;delete y.pagos;if(JSON.stringify(x)!==JSON.stringify(y))ks.add('fin')})});
  if(a.tasks.length!==b.tasks.length||a.tasks.map(t=>t.id).join()!==b.tasks.map(t=>t.id).join())ks.add('prazo');
  if(a.nome!==b.nome||a.inicio!==b.inicio||a.cal!==b.cal||JSON.stringify(a.feriados)!==JSON.stringify(b.feriados))ks.add('proj');
  if(JSON.stringify(a.reajuste)!==JSON.stringify(b.reajuste))ks.add('fin');
  return ks}

/* ===================== mutações ===================== */
let renderTimer=null,pendingFocus=null;
function scheduleRender(){clearTimeout(renderTimer);renderTimer=setTimeout(render,0)}
function mutate(fn){
  if(!state)return false;if(RO){toast('Você tem acesso só de leitura.');return false}
  const before=clone(state);
  try{structure();setSC(schedule());PESO=null;fn()}catch(e){state=before;structure();toast(e.message);scheduleRender();return false}
  const ks=kindsChanged(before,state);const nope=[...ks].filter(k=>!pode(k));
  if(nope.length){state=before;structure();setSC(schedule());toast(`Seu papel (${PAPEIS[papel()].split(' (')[0]}) não permite essa alteração.`);scheduleRender();return false}
  structure();PESO=null;const r=schedule();
  if(r.cycle&&!SC.cycle){state=before;structure();setSC(schedule());toast('Esse vínculo fecha um ciclo entre tarefas. Alteração desfeita.');scheduleRender();return false}
  setSC(r);hist.push(before);if(hist.length>80)hist.shift();
  persistDiff(before,state);scheduleRender();return true}
function undo(){if(RO)return;if(!hist.length){toast('Nada para desfazer.');return}const prev=hist.pop();const cur=state;state=prev;structure();PESO=null;persistDiff(cur,prev);if(ST.idx[ui.sel]==null)ui.sel=null;scheduleRender();toast('Alteração desfeita.')}

function scrollToTask(id){if(!GX||SC.S[id]==null)return;const gp=$('#ganttpane');const x=GX.X(SC.S[id]);if(x<gp.scrollLeft+20||x>gp.scrollLeft+gp.clientWidth-140)gp.scrollLeft=Math.max(0,x-80)}

function drawerPrazo(i,t,sum_,Dp,unit){const id=t.id;let h=`<div class="sec"><h3>Prazo</h3><div class="row2">`;

  const suc=[];state.tasks.forEach((s,j)=>s.preds.forEach(p=>{if(p.id===id)suc.push(`<div class="lk"><span class="k">${j+1}</span><span class="n">${esc(s.nome)}</span><span class="ty">${TIPOS[p.tipo||'TI']} ${lagTxt(+p.lag||0)}</span></div>`)}));

function drawerExec(i,t,sum_){const id=t.id,De=RO?'disabled':dis('exec'),Dp=RO?'disabled':dis('prazo');const stt=statusOf(i);let h='<div class="sec"><h3>Avanço</h3>';

async function addComment(tid,txt,file){if(!txt&&!file)return;if(RO){toast('Você tem acesso só de leitura.');return}

function catBlock(t,c,label){
  const f=t.fin[c],D=RO?'disabled':dis('fin'),Dg=RO?'disabled':dis('pago'),S=SC.S[t.id],F=SC.F[t.id];const ps=pagamentos(t).filter(p=>p.c===c);

    <div class="row2"><label>Valor total (R$)<input class="inp num" id="d-${c}-valor" data-a="valor" data-c="${c}" inputmode="decimal" value="${f.valor?moneyIn(f.valor):''}" placeholder="0,00" autocomplete="off" ${D}></label>`;

    h+=`<div class="lbl">Pagamento<div class="mut" style="padding-top:8px">Datas e valores ajustados um a um</div></div></div>
    <div class="mtop">${D?'':`<button class="btn sm ghost" data-a="toauto" data-c="${c}">← Voltar para prazo automático</button>`}<label class="ck"><input type="checkbox" id="d-${c}-fix" data-a="fixas" data-c="${c}" ${fix?'checked':''} ${D}>Datas fixas</label></div>
    <div class="mparc-h"><span>Data</span><span style="text-align:right">Valor (R$)</span><span style="text-align:right">%</span><span></span></div>`;
    f.parcelas.forEach((p,j)=>{const d=parcData(t,p);
      h+=`<div class="mparc-r"><input class="dt" id="d-${c}-p${j}-d" data-a="pp" data-c="${c}" data-i="${j}" data-f="data" value="${DTF(d)}" inputmode="numeric" aria-label="Data da parcela ${j+1}" autocomplete="off" ${D}>
        <input class="n" id="d-${c}-p${j}-v" data-a="pp" data-c="${c}" data-i="${j}" data-f="valor" inputmode="decimal" value="${moneyIn(f.valor*(+p.pct||0)/100)}" aria-label="Valor da parcela ${j+1}" autocomplete="off" ${D}>
        <span class="pc">${pctTxt(+p.pct||0)}%</span>${D?'<span></span>':`<button class="x" data-a="delp" data-c="${c}" data-i="${j}" aria-label="Remover parcela ${j+1}">${ic('x',13)}</button>`}</div>`});
    if(!D)h+=`<div><button class="btn sm" data-a="addp" data-c="${c}">${ic('plus',14)}Parcela</button></div>`;
    h+=`<p class="hint">${fix?'As datas não mudam se a tarefa mudar de data.':`As datas acompanham o ${f.base==='inicio'?'início':'término'} da tarefa.`} Mudar o valor de uma parcela recalcula o total.</p>`;
    const soma=sum(f.parcelas.map(p=>+p.pct||0));if(f.valor&&Math.abs(soma-100)>0.01)h+=`<div class="warnline">As parcelas somam ${pctTxt(soma)}% do total.${D?'':`<button class="btn sm" data-a="fix100" data-c="${c}">Ajustar a última</button>`}</div>`}
  else{const bsel=['medicao','fisico','mensal'].includes(f.modo)?f.modo:f.base;
    h+=`<label>Pagar a partir do<select class="inp" id="d-${c}-base" data-a="base" data-c="${c}" ${D}>${Object.entries(BASEN).map(([k,v])=>`<option value="${k}" ${bsel===k?'selected':''}>${v}</option>`).join('')}</select></label></div>`;
    if(f.modo==='fisico')h+=`<p class="hint">Paga em cada mês o que for executado no mês, proporcional aos dias trabalhados da tarefa. Se tiver um fluxo próprio, preencha na planilha.</p>`;
    else if(f.modo==='medicao')h+=`<div class="row2"><label>Pagar quantos dias após o fim de cada mês<input class="inp num" id="d-${c}-off" data-a="off" data-c="${c}" type="number" value="${+f.offset||0}" ${D}></label></div>`;

      h+=`<p class="hint">Contados a partir do ${f.base==='inicio'?'início':'término'} da tarefa (${DTF(f.base==='inicio'?S:F)}). Negativo = antes, ex.: -15/30.</p>`}}
  if(f.valor&&ps.length){const td=today();
    h+=`<div class="plist"><div class="head" style="grid-template-columns:22px 96px 1fr auto"><span title="Pago">✓</span><span>Data</span><span>Parcela</span><span>Valor</span></div>${ps.map(p=>{const venc=!p.pago&&p.d<td;
      return`<div class="pd"><input type="checkbox" data-a="pago" data-c="${c}" data-i="${p.i}" ${p.pago?'checked':''} ${Dg} aria-label="Marcar como pago"><span class="num">${DTF(p.d)}</span><span class="mut">${p.kind==='mensal'?'Mês '+ymLabel(p.mk):p.kind==='med'?(p.fis?'Execução de ':'Medição de ')+ymLabel(p.med):(p.n>1?(p.i+1)+'ª de '+p.n:'Parcela única')}${venc?' <span class="pill due"><i></i>vencida</span>':''}</span><span class="num">${brl(p.v)}</span>
      ${p.pago?`<div class="paidrow"><span class="pill paid"><i></i>Pago</span>em <input class="dt" id="d-${c}-pg${p.i}-d" data-a="pgdata" data-c="${c}" data-i="${p.i}" value="${DTF(iso2d(p.pago.data)??p.d)}" inputmode="numeric" ${Dg}> valor <input class="n" id="d-${c}-pg${p.i}-v" data-a="pgvalor" data-c="${c}" data-i="${p.i}" value="${moneyIn(p.pago.valor)}" inputmode="decimal" ${Dg}></div>`:''}</div>`}).join('')}</div>`;
    if(f.modo!=='manual'&&f.modo!=='mensal'&&!D)h+=`<div class="mtop"><button class="btn sm" data-a="planilha">${ic('cal',14)}Fluxo próprio mês a mês</button></div><div><button class="btn sm ghost" data-a="tomanual" data-c="${c}">${ic('cal',14)}Ajustar datas e valores um a um</button></div>`}
  return h+'</div></div>'}

<script>

const reaj=(v,d)=>{const r=state.reajuste;if(!r||!r.taxa)return v;const b=iso2d(r.base)??iso2d(state.inicio);if(d<=b)return v;return v*Math.pow(1+r.taxa/100,(d-b)/365)};

      const n=Math.max(0,Math.round(+R.parcelas||0));const rest=v-ent;if(n>0)for(let j=1;j<=n;j++)add(k+j,rest/n);else add(k,rest);k++}}

  return{ci,months,cat,tot,raw,cum:acc(tot),pago,pagoCum:acc(pago).map((v,i)=>months[i]>td?null:v),baseM,baseCum:base?acc(baseM):null,rec:recM,recCum:acc(recM),net,netCum:acc(net),
    total:sum(tot),totalRaw:sum(raw),pagoTot:sum(pago),recTot:sum(recM),fisPlan,fisBase,fisReal,hasRec:sum(recM)>0,hasBase:!!base,any}}

  const bw=Math.max(3,Math.min(40,band*.62)),rr=(x,y,w,h,r,up)=>{r=Math.min(r,Math.abs(h),w/2);if(h<=0)return'';return up?`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`:`M${x},${y}V${y+h-r}Q${x},${y+h} ${x+r},${y+h}H${x+w-r}Q${x+w},${y+h} ${x+w},${y+h-r}V${y}Z`};

function drawCmp(F,o){const box=$('#cmp-box');if(!box||!o)return;
  const all=new Set([...F.months,...o.months]);const ks=[...all].sort((a,b)=>a-b);const months=[];for(let k=ks[0];k<=ks[ks.length-1];k++)months.push(k);
  const map=(src,vals)=>{const m=new Map(src.map((k,i)=>[k,vals[i]]));let s=0;return months.map(k=>s+=(m.get(k)||0))};
  const a=map(F.months,F.tot),b=map(o.months,o.tot);
  box.innerHTML=`<div class="card"><div class="card-h"><h2>Comparação: ${esc(state.nome)} × ${esc(o.nome)}</h2></div><div class="chart" id="ch-cmp"></div>
    <table class="cmp-t" style="margin-top:10px"><thead><tr><th></th><th>${esc(state.nome)}</th><th>${esc(o.nome)}</th><th>Diferença</th></tr></thead><tbody>
    <tr><td>Custo total</td><td>${brl(F.total)}</td><td>${brl(o.total)}</td><td>${brl(o.total-F.total)}</td></tr>
    <tr><td>Término</td><td>${fmtD(o.selfF)}</td><td>${fmtD(o.F)}</td><td>${o.F-o.selfF>0?'+':''}${o.F-o.selfF} dias</td></tr>
    ${o.ind&&F.hasRec?`<tr><td>VPL</td><td>${brl(o.selfInd.vpl)}</td><td>${brl(o.ind.vpl)}</td><td>${brl(o.ind.vpl-o.selfInd.vpl)}</td></tr><tr><td>Exposição máxima</td><td>${brl(o.selfInd.expo)}</td><td>${brl(o.ind.expo)}</td><td>${brl(o.ind.expo-o.selfInd.expo)}</td></tr>`:''}
    </tbody></table></div>`;
  drawChart($('#ch-cmp'),{months,lines:[{n:state.nome,c:'var(--accent)',v:a,end:true},{n:o.nome,c:'var(--mo)',v:b,end:true,dash:true}]},240)}
function tabelaFluxo(F){const T=state.tasks;const cell=v=>v?`<td class="num">${brl(v)}</td>`:`<td class="num z">—</td>`;
  let h=`<table class="flux"><thead><tr><th>Item</th>${F.months.map(k=>`<th>${ymLabel(k)}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
  CATS.forEach(([c,l])=>{if(F.cat[c].some(x=>x))h+=`<tr><td><span class="sw" style="background:var(--${c})"></span>${l}</td>${F.cat[c].map(cell).join('')}${cell(sum(F.cat[c]))}</tr>`});
  h+=`<tr class="tot"><td>Desembolso do mês</td>${F.tot.map(cell).join('')}${cell(F.total)}</tr><tr><td>Acumulado</td>${F.cum.map(cell).join('')}<td></td></tr>`;
  h+=`<tr><td>Pago</td>${F.pago.map(cell).join('')}${cell(F.pagoTot)}</tr>`;
  if(F.hasBase)h+=`<tr><td>Linha de base</td>${F.baseM.map(cell).join('')}${cell(sum(F.baseM))}</tr>`;
  if(F.hasRec)h+=`<tr><td>Receitas</td>${F.rec.map(cell).join('')}${cell(F.recTot)}</tr><tr class="tot"><td>Fluxo líquido</td>${F.net.map(cell).join('')}${cell(sum(F.net))}</tr><tr><td>Saldo acumulado</td>${F.netCum.map(cell).join('')}<td></td></tr>`;
  h+=`<tr><td>Avanço físico previsto</td>${F.fisPlan.map(v=>`<td class="num">${pct1(v)}</td>`).join('')}<td></td></tr>`;
  h+=`<tr class="sub"><td colspan="${F.months.length+2}">Por tarefa</td></tr>`;
  T.forEach((t,i)=>{if(ST.sum[i])return;const ps=pagamentos(t);if(!ps.length)return;const r=F.months.map(()=>0);ps.forEach(p=>{const j=ym(p.d)-F.months[0];if(j>=0&&j<r.length)r[j]+=reaj(p.v,p.d)});
    h+=`<tr><td title="${esc(t.nome)}">${ST.eap[i]} ${esc(t.nome)}</td>${r.map(cell).join('')}${cell(sum(r))}</tr>`});
  return h+'</tbody></table>'}
function tsvFluxo(F,sep){const n=v=>v==null?'':(Math.round(v*100)/100).toString().replace('.',',');const q=x=>sep===';'&&/[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;
  const L=[['Item',...F.months.map(ymLabel),'Total']];CATS.forEach(([c,l])=>L.push([l,...F.cat[c].map(n),n(sum(F.cat[c]))]));
  L.push(['Desembolso do mês',...F.tot.map(n),n(F.total)],['Acumulado',...F.cum.map(n)],['Pago',...F.pago.map(n),n(F.pagoTot)]);
  if(F.hasBase)L.push(['Linha de base',...F.baseM.map(n)]);if(F.hasRec)L.push(['Receitas',...F.rec.map(n),n(F.recTot)],['Fluxo líquido',...F.net.map(n)],['Saldo acumulado',...F.netCum.map(n)]);
  L.push(['Avanço físico previsto (%)',...F.fisPlan.map(n)]);return L.map(r=>r.map(x=>q(String(x))).join(sep)).join('\n')}

function withState(st,fn){const sv={state,ST,SC,HOL,PAYC,PESO};state=st;structure();setSC(schedule());PESO=null;try{return fn()}finally{({state,ST,SC,HOL,PAYC,PESO}=sv)}}

    const [ts,as]=await Promise.all([STORE.collection('projetos/'+pid+'/tarefas').get(),STORE.collection('projetos/'+pid+'/aux').get()]);
    tasks=new Map(ts.docs.map(d=>[d.id,d.data()]));aux=new Map(as.docs.map(d=>[d.id,d.data()]));OTHER.set(pid,{t:Date.now(),tasks,aux})}}
  const st=buildState(pid,m,tasks);const selfF=state?Math.max(...state.tasks.map(t=>SC.F[t.id])):0;const selfInd=state&&ui.view==='cash'?(()=>{const F=fluxo();return F&&F.hasRec?indicadores(F,(auxDoc('receitas')||{}).tma||12):null})():null;
  const saveAux=remote.aux,savePid=ui.pid;
  return withState(st,()=>{remote.aux=aux;const pidSave=ui.pid;ui.pid=pid;try{const F=fluxo();let S=Infinity,Fm=-Infinity;st.tasks.forEach(t=>{S=Math.min(S,SC.S[t.id]);Fm=Math.max(Fm,SC.F[t.id])});
      const R=aux.get('receitas');const ind=F&&F.hasRec?indicadores(F,(R||{}).tma||12):null;
      return{pid,nome:st.nome,cenarioDe:st.cenarioDe,S,F:Fm,selfF,selfInd,months:F?F.months:[],tot:F?F.tot:[],rec:F?F.rec:[],total:F?F.total:0,raw:F?F.totalRaw:0,pago:F?F.pagoTot:0,recTot:F?F.recTot:0,fis:fisicoReal(),fisPlan:fisicoPlan(today()),ind,
        late:st.tasks.filter((t,i)=>!ST.sum[i]&&statusOf(i).k==='late').length,n:st.tasks.filter((t,i)=>!ST.sum[i]).length}}
    finally{ui.pid=pidSave;remote.aux=saveAux}})}

  const card=i=>{const t=T[i],id=t.id,s=statusOf(i);const n=cmtCount(id);
    return`<div class="ccard" data-tid="${id}"><div class="t"><div><div class="mut" style="font-size:11.5px">${ST.eap[i]} · ${esc(state.tasks[ST.parent[i]]?.nome||'')}</div><h3>${esc(t.nome)}</h3></div><span class="pill ${s.k}"><i></i>${s.l}</span></div>
      <div class="m"><span>${fmtD(SC.S[id])} → ${fmtD(SC.F[id])}</span>${t.resp?`<span>${esc(t.resp)}</span>`:''}<span>previsto hoje ${pct1(fracCal(SC.S[id],SC.F[id],td)*100)}</span></div>
      <div style="display:flex;align-items:center;gap:12px"><span class="big">${t.exec||0}%</span><input type="range" min="0" max="100" step="5" value="${t.exec||0}" data-cf="exec" aria-label="Percentual executado" ${De}></div>
      <div class="acts">${De?'':`<button class="btn sm" data-cf="mais">+10%</button><button class="btn sm" data-cf="fim">${ic('check',14)}Concluída</button>`}<button class="btn sm" data-cf="cmt">Comentar${n?` (${n})`:''}</button>${ASSETS&&!RO?`<label class="btn sm" style="cursor:pointer">${ic('camera',14)}Foto<input type="file" accept="image/*" capture="environment" data-cf="foto" hidden></label>`:''}</div></div>`};
  const sec=(t,arr)=>arr.filter(f).length?`<div class="grp-h">${t} (${arr.filter(f).length})</div><div class="cgrid">${arr.filter(f).map(card).join('')}</div>`:'';
  el.innerHTML=`<div class="toolbar"><div class="seg" id="campo-f"><button data-m="0" class="${mine?'':'on'}">Todas</button><button data-m="1" class="${mine?'on':''}">Minhas</button></div><span class="mut">Avanço físico da obra: <b>${pct1(fisicoReal())}</b> (previsto ${pct1(fisicoPlan(td))})</span></div>
    ${sec('Atrasadas',grupos.late)}${sec('Em andamento',grupos.run)}${sec('Começam nas próximas 3 semanas',grupos.next)}
    ${!grupos.late.length&&!grupos.run.length&&!grupos.next.length?'<div class="state"><div class="box"><p>Nenhuma tarefa em andamento ou próxima. As tarefas aparecem aqui quando chega a data de início.</p></div></div>':''}`}
</script>
<script>
/* ===================== pessoas e presença ===================== */
let peers=[],peerProf={};const wantSet=new Set();let wantT=0;
function wantNames(ids){if(!USER)return;let add=false;ids.forEach(id=>{if(id&&!peerProf[id]&&!wantSet.has(id)){wantSet.add(id);add=true}});if(add&&!wantT)wantT=setTimeout(async()=>{wantT=0;const ids=[...wantSet];wantSet.clear();try{const ps=await USER.profiles(ids);ids.forEach(id=>peerProf[id]=ps[id]);scheduleRender()}catch(e){}},50)}
const nameOf=id=>!id?(MODE==='local'?'você':'alguém'):id===ME.id?(ME.name||'você'):(peerProf[id]&&peerProf[id].name)||'alguém da equipe';
function presence(){if(!ROOM)return;try{ROOM.presence({pid:ui.pid||null,sel:ui.sel||null,view:ui.view}).catch(()=>{})}catch(e){}}
function peerSel(){const m={};peers.forEach(p=>{if(p.presence&&p.presence.pid===ui.pid&&p.presence.sel&&!p.isMe){m[p.presence.sel]=peerProf[p.by]||{name:'',avatarUrl:''}}});return m}
function renderPeers(){const el=$('#peers');const here=peers.filter(p=>!p.isMe&&p.kind==='viewer'&&p.presence&&p.presence.pid===ui.pid);const ids=[...new Set(here.map(p=>p.by).filter(Boolean))];
  if(!here.length){el.innerHTML='';return}wantNames(ids);
  el.innerHTML=`<span class="stack">${ids.slice(0,4).map(id=>{const p=peerProf[id];return p?`<img src="${esc(p.avatarUrl)}" alt="${esc(p.name||'Alguém')}" title="${esc(p.name||'Alguém')}">`:''}).join('')}</span><span>+${here.length} aqui</span>`}

/* ===================== modais e menus ===================== */
function modal(html,bind,wide){MODAL_RENDER=null;const root=$('#modal-root');root.innerHTML=`<div class="scrim"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const sc=root.firstChild;sc.addEventListener('mousedown',e=>{if(e.target===sc)closeModal()});bind&&bind(root);const f=root.querySelector('input:not([type=file]),textarea,select,.btn.primary');f&&f.focus()}
function closeModal(){MODAL_RENDER=null;$('#modal-root').innerHTML='';scheduleRender()}
function confirmModal(title,text,l1,f1,l2,f2,danger){modal(`<h2>${title}</h2><p>${text}</p><div class="acts"><button class="btn" data-m="x">Cancelar</button>${l2?`<button class="btn" data-m="2">${l2}</button>`:''}<button class="btn ${danger?'armed':'primary'}" data-m="1">${l1}</button></div>`,
  r=>r.querySelector('.acts').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;closeModal();if(m==='1')f1();if(m==='2')f2()})}
function openText(title,text,val){modal(`<h2>${title}</h2><p>${text}</p><textarea readonly>${esc(val)}</textarea><div class="acts"><button class="btn primary" data-m="x">Fechar</button></div>`,r=>{r.querySelector('[data-m]').onclick=closeModal;setTimeout(()=>r.querySelector('textarea').select(),30)})}
function closeMenu(){$('#menu-root').innerHTML=''}
const nomeArq=()=>(state?state.nome:'projeto').replace(/[\\/:*?"<>|]+/g,'').trim()||'projeto';
async function baixar(filename,data){if(DL){try{await DL.save({filename,data});return}catch(e){if(e&&e.code==='declined')return}}
  try{const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove()}catch(e){if(typeof data==='string')openText('Copiar conteúdo','O download não está disponível aqui. Copie o texto abaixo.',data);else toast('O download não está disponível aqui.')}}

function openConfig(){if(!state)return;const fer=state.feriados.slice().sort().map(s=>{const d=iso2d(s);return d==null?s:DTF(d)}).join('\n');const D=RO||!pode('proj')?'disabled':'';const Df=RO||!pode('fin')?'disabled':'';
  modal(`<h2>Calendário e reajuste do projeto</h2><div class="row2"><label class="lbl">Início do projeto<input class="inp num dt" id="cf-ini" value="${DTF(iso2d(state.inicio))}" inputmode="numeric" autocomplete="off" ${D}></label>
    <label class="lbl">Contar prazos em<select class="inp" id="cf-cal" ${D}><option value="uteis" ${state.cal==='uteis'?'selected':''}>Dias úteis (seg–sex)</option><option value="corridos" ${state.cal==='corridos'?'selected':''}>Dias corridos</option></select></label></div>
    <label class="lbl">Feriados e dias sem obra (um por linha, dd/mm/aaaa)<textarea id="cf-fer" ${D}>${esc(fer)}</textarea></label>
    <p>A lista traz os feriados nacionais de 2026 a 2028 e o Carnaval. Inclua os feriados municipais da obra.</p>
    <div class="row2"><label class="lbl">Reajuste dos custos (INCC estimado, % ao ano)<input class="inp num" id="cf-tx" inputmode="decimal" value="${state.reajuste.taxa?pctTxt(state.reajuste.taxa):''}" placeholder="0 = sem reajuste" ${Df}></label>
      <label class="lbl">Data-base do orçamento<input class="inp num dt" id="cf-db" value="${state.reajuste.base?DTF(iso2d(state.reajuste.base)):DTF(iso2d(state.inicio))}" inputmode="numeric" ${Df}></label></div>
    <p>Com reajuste, o fluxo de caixa corrige cada pagamento futuro pela taxa, a partir da data-base. Os valores digitados nas tarefas continuam sendo os da data-base.</p>
    <div class="acts">${D?'':'<button class="btn" data-m="r">Restaurar feriados nacionais</button>'}<button class="btn" data-m="x">Fechar</button>${D&&Df?'':'<button class="btn primary" data-m="ok">Aplicar</button>'}</div>`,
  r=>r.querySelector('.acts').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;if(m==='x')return closeModal();
    if(m==='r'){r.querySelector('#cf-fer').value=FERIADOS_BR.map(s=>DTF(iso2d(s))).join('\n');return}
    try{const out=[],bad=[];r.querySelector('#cf-fer').value.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(s=>{const d=parseDateBR(s);if(d==null||d===undefined)bad.push(s);else out.push(d2iso(d))});
      if(bad.length)throw new Error('Datas não reconhecidas: '+bad.slice(0,3).join(', '));
      const di=readDate(r.querySelector('#cf-ini').value);if(di==null)throw new Error('Informe o início do projeto.');const cal=r.querySelector('#cf-cal').value;
      const tx=parseNum(r.querySelector('#cf-tx').value);const db=readDate(r.querySelector('#cf-db').value);closeModal();
      mutate(()=>{if(pode('proj')){state.feriados=out;state.inicio=d2iso(di);state.cal=cal}if(pode('fin'))state.reajuste={taxa:Math.max(0,tx),base:db!=null?d2iso(db):state.inicio}});toast('Configuração aplicada e cronograma recalculado.')}catch(err){toast(err.message)}})}

function openBase(){if(!state)return;const b=auxDoc('base');const can=!RO&&pode('prazo');
  const salvar=()=>{const F=fluxo();const tasks={};state.tasks.forEach((t,i)=>{if(!ST.sum[i])tasks[t.id]=[SC.S[t.id],SC.F[t.id]]});
    write('projetos/'+ui.pid+'/aux/base','set',{criadoEm:Date.now(),por:ME.id||null,tasks,mensal:F?Object.fromEntries(F.months.map((k,i)=>[String(k),Math.round(F.tot[i]*100)/100])):{},total:F?F.total:0});
    logHist(ui.pid,['Salvou a linha de base']);closeModal();toast('Linha de base salva. Os desvios aparecem no cronograma e no fluxo.')};
  modal(`<h2>Linha de base</h2><p>A linha de base é uma foto do plano aprovado (datas e fluxo de caixa). Depois, o planejador mostra quanto cada tarefa atrasou ou adiantou e compara o desembolso real com o previsto.</p>
    ${b?`<p><b>Linha de base atual:</b> salva em ${new Date(b.criadoEm).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}${b.por?' por '+esc(nameOf(b.por)):''} · ${Object.keys(b.tasks||{}).length} tarefas · ${brl(b.total)}</p>`:'<p>Este projeto ainda não tem linha de base.</p>'}
    <div class="acts"><button class="btn" data-m="x">Fechar</button>${can&&b?'<button class="btn danger" data-m="del">Remover</button>':''}${can?`<button class="btn primary" data-m="ok">${b?'Substituir pelo plano atual':'Salvar o plano atual como linha de base'}</button>`:''}</div>`,
  r=>r.querySelector('.acts').onclick=e=>{const x=e.target.closest('[data-m]');if(!x)return;if(x.dataset.m==='x')closeModal();if(x.dataset.m==='ok')salvar();
    if(x.dataset.m==='del'){write('projetos/'+ui.pid+'/aux/base','delete');logHist(ui.pid,['Removeu a linha de base']);closeModal()}});if(b&&b.por)wantNames([b.por])}

function openReceitas(){const R=Object.assign({lotes:0,preco:0,entrada:10,parcelas:60,inicio:state.inicio,ritmo:10,tma:12,avulsas:[]},clone(auxDoc('receitas')||{}));const D=RO||!pode('fin')?'disabled':'';
  const avRows=()=>R.avulsas.map((a,j)=>`<div class="mparc-r" style="grid-template-columns:1fr 120px 130px 26px"><input id="rv-d${j}" value="${esc(a.desc||'')}" placeholder="Descrição" ${D}><input class="dt" id="rv-dt${j}" value="${a.data?DTF(iso2d(a.data)):''}" placeholder="dd/mm/aaaa" ${D}><input class="n" id="rv-v${j}" value="${a.valor?moneyIn(a.valor):''}" placeholder="0,00" ${D}>${D?'<span></span>':`<button class="x" data-rm="${j}" aria-label="Remover">${ic('x',13)}</button>`}</div>`).join('');
  modal(`<h2>Vendas e receitas</h2><p>Projeção de vendas dos lotes. Cada venda gera a entrada no mês da venda e o saldo em parcelas mensais a partir do mês seguinte.</p>
    <div class="row2"><label class="lbl">Número de lotes<input class="inp num" id="rc-lotes" inputmode="numeric" value="${R.lotes||''}" ${D}></label><label class="lbl">Preço médio do lote (R$)<input class="inp num" id="rc-preco" inputmode="decimal" value="${R.preco?moneyIn(R.preco):''}" ${D}></label>
    <label class="lbl">Entrada (%)<input class="inp num" id="rc-ent" inputmode="decimal" value="${pctTxt(R.entrada)}" ${D}></label><label class="lbl">Parcelas mensais<input class="inp num" id="rc-par" inputmode="numeric" value="${R.parcelas}" ${D}></label>
    <label class="lbl">Início das vendas<input class="inp num dt" id="rc-ini" value="${R.inicio?DTF(iso2d(R.inicio)):''}" inputmode="numeric" ${D}></label><label class="lbl">Ritmo (lotes vendidos por mês)<input class="inp num" id="rc-rit" inputmode="numeric" value="${R.ritmo}" ${D}></label>
    <label class="lbl">Taxa mínima de atratividade (% a.a.)<input class="inp num" id="rc-tma" inputmode="decimal" value="${pctTxt(R.tma)}" ${D}></label></div>
    <h2 style="font-size:15px">Outras entradas</h2><p>Permutas, aportes, financiamento, venda de áreas comerciais…</p><div id="rc-av" style="display:flex;flex-direction:column;gap:6px">${avRows()}</div>
    <div class="acts" style="justify-content:space-between">${D?'<span></span>':'<button class="btn sm" data-m="add">+ Entrada avulsa</button>'}<span><button class="btn" data-m="x">Fechar</button> ${D?'':'<button class="btn primary" data-m="ok">Salvar</button>'}</span></div>`,
  r=>{const read=()=>{R.avulsas=R.avulsas.map((a,j)=>({desc:r.querySelector('#rv-d'+j).value,data:(()=>{const d=parseDateBR(r.querySelector('#rv-dt'+j).value);return d!=null&&d!==undefined?d2iso(d):null})(),valor:parseNum(r.querySelector('#rv-v'+j).value)}))};
    r.querySelector('.modal').addEventListener('click',e=>{const rm=e.target.closest('[data-rm]');if(rm){read();R.avulsas.splice(+rm.dataset.rm,1);r.querySelector('#rc-av').innerHTML=avRows();return}
      const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;if(m==='x')return closeModal();
      if(m==='add'){read();R.avulsas.push({desc:'',data:null,valor:0});r.querySelector('#rc-av').innerHTML=avRows();return}
      if(m==='ok'){read();try{const di=readDate(r.querySelector('#rc-ini').value);
        const out={lotes:Math.round(parseNum(r.querySelector('#rc-lotes').value)),preco:parseNum(r.querySelector('#rc-preco').value),entrada:parseNum(r.querySelector('#rc-ent').value),parcelas:Math.round(parseNum(r.querySelector('#rc-par').value)),
          inicio:di!=null?d2iso(di):null,ritmo:Math.max(0,parseNum(r.querySelector('#rc-rit').value)),tma:parseNum(r.querySelector('#rc-tma').value),avulsas:R.avulsas.filter(a=>a.valor&&a.data)};
        write('projetos/'+ui.pid+'/aux/receitas','set',out);logHist(ui.pid,['Atualizou vendas e receitas']);closeModal();toast('Receitas salvas.')}catch(err){toast(err.message)}}})})}

async function openHist(){if(!state)return;modal(`<h2>Histórico de alterações</h2><p>Quem mudou o quê neste projeto. Cada pessoa registra as próprias alterações.</p><div class="hlist" id="hl"><div class="e" style="grid-template-columns:1fr"><span class="mut">Carregando…</span></div></div><div class="acts"><button class="btn primary" data-m="x">Fechar</button></div>`,r=>r.querySelector('[data-m]').onclick=closeModal,true);
  try{const s=await STORE.collection('projetos/'+ui.pid+'/hist').get();const all=[];s.docs.forEach(d=>{const x=d.data();(x.itens||[]).forEach(it=>all.push({...it,por:x.por}))});all.sort((a,b)=>b.em-a.em);
    wantNames(all.map(a=>a.por));await new Promise(r=>setTimeout(r,250));
    const el=$('#hl');if(!el)return;if(!all.length){el.innerHTML='<div class="e" style="grid-template-columns:1fr"><span class="mut">Nada registrado ainda.</span></div>';return}
    let cur='',h='';all.slice(0,600).forEach(a=>{const d=new Date(a.em);const dk=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});if(dk!==cur){cur=dk;h+=`<div class="d">${dk}</div>`}
      h+=`<div class="e"><span class="hr">${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span><span class="w">${esc(nameOf(a.por))}</span><span>${esc(a.txt)}</span></div>`});el.innerHTML=h}catch(e){const el=$('#hl');if(el)el.innerHTML='<div class="e" style="grid-template-columns:1fr"><span class="mut">Não consegui carregar o histórico.</span></div>'}}

async function openEquipe(){let people=[];try{people=USER?await USER.search(''):[]}catch(e){}
  const ids=new Set([...people.map(p=>p.id),...Object.keys(remote.papeis),...[...remote.coment.values()].map(c=>c.por)].filter(Boolean));ids.delete(ME.id);
  let profs={};try{profs=USER?await USER.profiles([...ids]):{}}catch(e){}
  const row=id=>{const p=profs[id]||{};return`<div class="eq-row"><img src="${esc(p.avatarUrl||'')}" alt=""><span>${esc(p.name||'Pessoa sem nome')}${p.guest?' <span class="mut">(convidado)</span>':''}</span><select class="inp" data-uid="${id}">${Object.entries(PAPEIS).map(([k,v])=>`<option value="${k}" ${(remote.papeis[id]||'admin')===k?'selected':''}>${v}</option>`).join('')}</select></div>`};
  modal(`<h2>Papéis da equipe</h2><p>Defina o que cada pessoa pode mudar dentro do planejador. Quem não estiver na lista entra como Administrador. Para impedir de vez que alguém edite, use também o menu Compartilhar da página (acesso de Visualizador).</p>
    <div>${[...ids].map(row).join('')||'<p class="mut">Ninguém além de você usou o planejador ainda. As pessoas aparecem aqui depois que abrirem o link.</p>'}</div>
    <div class="acts"><button class="btn" data-m="x">Fechar</button><button class="btn primary" data-m="ok">Salvar papéis</button></div>`,
  r=>r.querySelector('.acts').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;if(b.dataset.m==='x')return closeModal();
    const map={...remote.papeis};r.querySelectorAll('select[data-uid]').forEach(s=>map[s.dataset.uid]=s.value);write('config/papeis','set',{map});closeModal();toast('Papéis salvos.')})}

/* ----- relatório ----- */
function relatorioHTML(){let F=fluxo();const td=today();const T=state.tasks;const R=auxDoc('receitas')||{};const I=F&&F.hasRec?indicadores(F,R.tma||12):null;const base=auxDoc('base');
  let mn=Infinity,mx=-Infinity;T.forEach(t=>{mn=Math.min(mn,SC.S[t.id]);mx=Math.max(mx,SC.F[t.id])});let bF=null;if(base&&base.tasks){bF=-Infinity;Object.values(base.tasks).forEach(x=>bF=Math.max(bF,x[1]))}
  const fr=fisicoReal(),fp=fisicoPlan(td);const col={text:'#5a6472',grid:'#e6e9ee',base:'#b9c0ca',surface:'#ffffff',hl:'#ffffff'};
  const k=(l,v,s)=>`<td style="padding:10px 12px;border:1px solid #e3e7ec;vertical-align:top"><div style="font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#5a6472;font-weight:600">${l}</div><div style="font-size:19px;font-weight:650;margin-top:2px">${v}</div>${s?`<div style="font-size:12px;color:#7d8794">${s}</div>`:''}</td>`;
  const th=s=>`<th style="text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5a6472;padding:6px 8px;border-bottom:1px solid #cfd5dc">${s}</th>`;const tdc=(s,r)=>`<td style="padding:6px 8px;border-bottom:1px solid #eceff3;${r?'text-align:right;font-variant-numeric:tabular-nums':''}">${s}</td>`;
  let h=`<div style="font-family:Archivo,Segoe UI,Arial,sans-serif;color:#16202a;max-width:880px"><div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #16202a;padding-bottom:8px;margin-bottom:14px"><div><div style="font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#5a6472;font-weight:600">Relatório de acompanhamento</div><div style="font-size:24px;font-weight:700">${esc(state.nome)}</div></div><div style="font-size:12px;color:#5a6472;text-align:right">${new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}<br>${esc(ME.name||'')}</div></div>`;
  h+=`<table style="border-collapse:collapse;width:100%;margin-bottom:16px"><tr>${k('Avanço físico',pct1(fr),`previsto ${pct1(fp)}`)}${k('Custo orçado',brl(F?F.totalRaw:0),state.reajuste.taxa?`${brl(F?F.total:0)} com INCC`:'')}${k('Pago',brl(F?F.pagoTot:0),`saldo ${brl((F?F.totalRaw:0)-(F?F.pagoTot:0))}`)}${k('Prazo',`${fmtD(mn)} → ${fmtD(mx)}`,bF!=null?(mx-bF>0?`<span style="color:#b42318">${mx-bF} dias de atraso</span> sobre a linha de base`:mx-bF<0?`${bF-mx} dias adiantado`:'no prazo da linha de base'):'sem linha de base')}</tr>
    ${I?`<tr>${k('Receitas',brl(F.recTot),'')}${k('Resultado',brl(I.lucro),I.margem!=null?'margem '+pct1(I.margem):'')}${k('VPL / TIR',brl(I.vpl),I.tir!=null?'TIR '+pct1(I.tir)+' a.a.':'')}${k('Exposição máxima',brl(I.expo),I.expoK!=null?ymLong(I.expoK):'')}</tr>`:''}</table>`;
  if(F){const F0=F;F=trimF(F);const sl=[{n:'Previsto',c:'#243249',v:F.cum,area:true,step:'end',start0:true,end:true},{n:'Pago',c:'#1d7a45',v:F.pagoCum,step:'end',start0:true,w:2.5}];if(F.hasBase)sl.push({n:'Linha de base',c:'#8790a0',v:F.baseCum,dash:true,step:'end',start0:true});
    const fl=[{n:'Previsto',c:'#243249',v:F.fisPlan,step:'end',start0:true,area:true},{n:'Realizado',c:'#1d7a45',v:F.fisReal,step:'end',w:2.5,end:true}];
    const leg=a=>`<div style="font-size:12px;color:#5a6472;margin:2px 0 12px">${a.map(s=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px"><span style="width:12px;height:3px;background:${s.c};display:inline-block"></span>${s.n}</span>`).join('')}</div>`;
    h+=`<div style="font-weight:650;font-size:15px;margin:6px 0">Curva S financeira (acumulado)</div>${chartSVG({months:F.months,lines:sl,colors:col,fixed:true},860,240).svg}${leg(sl)}`;

function exportMSP(){const T=state.tasks;const uid={};T.forEach((t,i)=>uid[t.id]=i+1);const x=s=>esc(s).replace(/'/g,'&apos;');const dt=(d,h)=>d2iso(d)+'T'+h;
  let s=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Project xmlns="http://schemas.microsoft.com/project"><Name>${x(state.nome)}</Name><Title>${x(state.nome)}</Title><StartDate>${dt(iso2d(state.inicio),'08:00:00')}</StartDate><MinutesPerDay>480</MinutesPerDay><MinutesPerWeek>2400</MinutesPerWeek><DaysPerMonth>20</DaysPerMonth><Tasks>`;
  T.forEach((t,i)=>{const id=t.id,c=custo(i);s+=`<Task><UID>${i+1}</UID><ID>${i+1}</ID><Name>${x(t.nome)}</Name><OutlineNumber>${ST.eap[i]}</OutlineNumber><OutlineLevel>${t.nivel+1}</OutlineLevel><Start>${dt(SC.S[id],'08:00:00')}</Start><Finish>${dt(SC.F[id],'17:00:00')}</Finish><Duration>PT${SC.D[id]*8}H0M0S</Duration><DurationFormat>7</DurationFormat><Summary>${ST.sum[i]?1:0}</Summary><Milestone>${!ST.sum[i]&&t.dur===0?1:0}</Milestone><PercentComplete>${Math.round(ST.sum[i]?execAgg(i):t.exec||0)}</PercentComplete><Cost>${Math.round(c.tot*100)}</Cost>`;
    if(t.snet&&!ST.sum[i])s+=`<ConstraintType>4</ConstraintType><ConstraintDate>${dt(iso2d(t.snet),'08:00:00')}</ConstraintDate>`;
    t.preds.forEach(p=>{if(!uid[p.id])return;const ty={TT:0,TI:1,IT:2,II:3}[p.tipo||'TI'];s+=`<PredecessorLink><PredecessorUID>${uid[p.id]}</PredecessorUID><Type>${ty}</Type><LinkLag>${(+p.lag||0)*4800}</LinkLag><LagFormat>7</LagFormat></PredecessorLink>`});s+='</Task>'});
  s+='</Tasks></Project>';baixar(nomeArq()+'.xml',s)}
function importMSP(txt,fname){const doc=new DOMParser().parseFromString(txt,'application/xml');if(doc.querySelector('parsererror'))throw new Error('o XML está corrompido.');
  const get=(el,n)=>{const c=[...el.children].find(x=>x.localName===n);return c?c.textContent:''};const tasksEl=[...doc.getElementsByTagNameNS('*','Task')];if(!tasksEl.length)throw new Error('não encontrei tarefas no XML do MS Project.');
  const hasZero=tasksEl.some(e=>get(e,'OutlineLevel')==='0');const map={};const rows=[];
  tasksEl.forEach(e=>{if(get(e,'IsNull')==='1')return;const lvl=+get(e,'OutlineLevel')||0;const nivel=hasZero?lvl:Math.max(0,lvl-1);const dur=(()=>{const m=get(e,'Duration').match(/PT(\d+(?:\.\d+)?)H(\d+)M/);return m?Math.round((+m[1]+ +m[2]/60)/8):0})();
    const id=nid();map[get(e,'UID')]=id;const t=normTask(id,{nome:get(e,'Name')||'Tarefa',dur,exec:+get(e,'PercentComplete')||0},nivel);t._start=get(e,'Start');
    t._links=[...e.children].filter(x=>x.localName==='PredecessorLink').map(l=>({u:get(l,'PredecessorUID'),ty:{0:'TT',1:'TI',2:'IT',3:'II'}[get(l,'Type')]||'TI',lag:Math.round((+get(l,'LinkLag')||0)/4800)}));rows.push(t)});
  let prev=-1;rows.forEach(t=>{t.nivel=Math.max(0,Math.min(t.nivel,prev+1));prev=t.nivel;t.preds=t._links.filter(l=>map[l.u]).map(l=>({id:map[l.u],tipo:l.ty,lag:l.lag}));if(!t.preds.length&&t._start)t.snet=t._start.slice(0,10);delete t._links;delete t._start});
  const starts=rows.map(t=>t.snet).filter(Boolean).sort();const nome=(doc.getElementsByTagNameNS('*','Title')[0]||doc.getElementsByTagNameNS('*','Name')[0]||{}).textContent||fname.replace(/\.xml$/i,'');
  criarProjeto({nome,inicio:starts[0]||d2iso(today()),tasks:rows})}
async function importPlanilha(buf,fname){const X=await loadXLSX();const wb=X.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];const aoa=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  let hi=aoa.findIndex(r=>r.some(c=>/tarefa|nome|descri|servi/i.test(String(c))));if(hi<0)throw new Error('não encontrei a coluna “Tarefa” na planilha.');
  const H=aoa[hi].map(c=>String(c).trim().toLowerCase());const col=re=>H.findIndex(h=>re.test(h));
  const ci={eap:col(/^eap|^item|^c[oó]d/),niv:col(/n[ií]vel/),nome:col(/tarefa|nome|descri|servi/),dur:col(/dura/),ini:col(/in[ií]cio/),fim:col(/t[eé]rmino|^fim/),pred:col(/predec/),exec:col(/execut|%/),resp:col(/respons/),
    mat:col(/material/),mo:col(/m[aã]o/),eq:col(/equip/),ter:col(/terceir|taxa/),tot:col(/^total|^valor|^custo|or[cç]ado/)};
  const toDay=v=>{if(v instanceof Date)return Math.round(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())/DAY);if(typeof v==='number'&&v>20000&&v<80000)return Math.round(v-25569);const d=parseDateBR(v);return d==null||d===undefined?null:d};
  const rows=[];aoa.slice(hi+1).forEach(r=>{const nome=String(r[ci.nome]??'').trim();if(!nome)return;let nivel=1;
    if(ci.niv>=0&&r[ci.niv]!=='')nivel=Math.max(0,(+r[ci.niv]||1)-1);else if(ci.eap>=0&&String(r[ci.eap]).trim())nivel=String(r[ci.eap]).trim().replace(/\.$/,'').split('.').length-1;else{const sp=String(r[ci.nome]).match(/^\s*/)[0].length;nivel=Math.floor(sp/2)+1}
    const ini=ci.ini>=0?toDay(r[ci.ini]):null,fim=ci.fim>=0?toDay(r[ci.fim]):null;let dur=ci.dur>=0?Math.round(parseNum(r[ci.dur])):0;if(!dur&&ini!=null&&fim!=null)dur=Math.max(1,Math.round((fim-ini+1)*5/7));
    const t=normTask(nid(),{nome,dur,exec:ci.exec>=0?Math.min(100,parseNum(r[ci.exec])):0,resp:ci.resp>=0?String(r[ci.resp]||''):''},nivel);
    CATS.forEach(([c])=>{if(ci[c]>=0)t.fin[c].valor=Math.max(0,parseNum(r[ci[c]]))});if(ci.tot>=0&&!CATS.some(([c])=>ci[c]>=0))t.fin.mat.valor=Math.max(0,parseNum(r[ci.tot]));
    t._ini=ini;t._pred=ci.pred>=0?String(r[ci.pred]||''):'';rows.push(t)});
  if(!rows.length)throw new Error('a planilha não tem linhas de tarefas.');
  if(rows.every(t=>t.nivel>=1)&&rows[0].nivel>0)rows.unshift(normTask(nid(),{nome:fname.replace(/\.(xlsx|xls|csv)$/i,''),dur:0},0));
  let prev=-1;rows.forEach(t=>{t.nivel=Math.max(0,Math.min(t.nivel,prev+1));prev=t.nivel});
  const off=rows.length-aoa.slice(hi+1).filter(r=>String(r[ci.nome]??'').trim()).length;
  rows.forEach(t=>{if(t._pred){try{t.preds=parsePreds(t._pred.split(/[;,]/).map(x=>x.trim().replace(/^\d+/,m=>String(+m+off))).join(';'),t.id,rows)}catch(e){}}if(!t.preds.length&&t._ini!=null)t.snet=d2iso(t._ini);delete t._pred;delete t._ini});
  const starts=rows.map(t=>t.snet).filter(Boolean).sort();
  rows.forEach((t,i)=>{if(i+1<rows.length&&rows[i+1].nivel>t.nivel){CATS.forEach(([c])=>t.fin[c].valor=0)}});
  criarProjeto({nome:fname.replace(/\.(xlsx|xls|csv)$/i,''),inicio:starts[0]||d2iso(today()),tasks:rows})}
function importJSON(txt){const j=JSON.parse(txt);if(!j||!Array.isArray(j.tasks)||!j.tasks.length)throw new Error('o arquivo não tem tarefas.');

  const tasks=j.tasks.map(t=>{const nv=Math.max(0,Math.min(+t.nivel||0,prev+1));prev=nv;const n=normTask(ids[t.id],t,nv);n.preds=n.preds.filter(p=>ids[p.id]).map(p=>({id:ids[p.id],tipo:p.tipo||'TI',lag:+p.lag||0}));return n});
