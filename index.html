<script>
/* ===================== distribuição mês a mês (planilha) ===================== */
const r2=v=>Math.round((+v||0)*100)/100;
const mensSum=f=>r2(sum(Object.values(f.mens||{}).map(x=>+x||0)));
function toMensal(t,c){const f=t.fin[c];if(f.modo==='mensal')return;const ps=pagamentos(t).filter(p=>p.c===c);const S0=ym(SC.S[t.id]);const mens={};
  ps.forEach(p=>{const r=ym(p.d)-S0;mens[r]=r2((mens[r]||0)+p.v)});
  const seen=new Set();f.pagos=f.pagos.map(pg=>{const p=ps.find(x=>x.i===pg.i);if(!p)return null;const ni=1000+ym(p.d)-S0;if(seen.has(ni))return null;seen.add(ni);return{...pg,i:ni}}).filter(Boolean);
  f.mens=mens;f.modo='mensal';f.valor=mensSum(f);PAYC.delete(t.id)}
function distribuirPrazo(t,c,total){const f=t.fin[c];const S=SC.S[t.id],E=SC.E[t.id],S0=ym(S);const m=new Map();
  if(t.dur===0||E<=S)m.set(0,1);else for(let d=S;d<E;d++)if(isWork(d)){const r=ym(d)-S0;m.set(r,(m.get(r)||0)+1)}
  const tot=sum([...m.values()]);const keys=[...m.keys()].sort((a,b)=>a-b);let acc=0;f.mens={};
  keys.forEach((r,j)=>{const v=j===keys.length-1?r2(total-acc):r2(total*m.get(r)/tot);acc=r2(acc+v);if(v)f.mens[r]=v})}
function setTotal(t,c,v){const f=t.fin[c];
  if(f.modo==='mensal'){const cur=mensSum(f);if(cur>0&&v>0){const ks=Object.keys(f.mens).filter(k=>+f.mens[k]);let acc=0;ks.forEach((k,j)=>{f.mens[k]=j===ks.length-1?r2(v-acc):r2(f.mens[k]*v/cur);acc=r2(acc+f.mens[k])})}
    else if(v>0)distribuirPrazo(t,c,v);else f.mens={}}
  setValor(f,v);PAYC.delete(t.id)}
function setMesMany(list){if(!list.length)return;mutate(()=>{list.forEach(({tid,c,k,v})=>{const t=byId(tid);if(!t)return;const f=t.fin[c];if(f.modo!=='mensal')toMensal(t,c);
  const rel=k-ym(SC.S[t.id]);if(v>0)f.mens[rel]=r2(v);else delete f.mens[rel];setValor(f,mensSum(f));PAYC.delete(t.id)})})}
function mesValores(t,c){const m=new Map();pagamentos(t).forEach(p=>{if(p.c!==c)return;const k=ym(p.d);m.set(k,(m.get(k)||0)+p.v)});return m}
const mesCell=(pre,t,c,k,v,ex,D,cur)=>`<td class="${ex?'ex':''} ${k===cur?'cur':''}"><input class="mc" id="${pre}-${t.id}-${c}-${k}" data-tid="${t.id}" data-c="${c}" data-k="${k}" inputmode="decimal" value="${v?moneyIn(v):''}" aria-label="${CATN[c]} em ${ymLabel(k)}" autocomplete="off" ${D}></td>`;

/* ----- aba Pagamentos → Planilha mês a mês ----- */

  const T=state.tasks,D=RO?'disabled':dis('fin'),q=ui.pagQ.trim().toLowerCase(),cur=ym(today());const mc=ui.mesCat||'todas';

  let a=Infinity,b=-Infinity;T.forEach((t,i)=>{if(ST.sum[i])return;a=Math.min(a,ym(SC.S[t.id]));b=Math.max(b,ym(SC.F[t.id]));pagamentos(t).forEach(p=>{a=Math.min(a,ym(p.d));b=Math.max(b,ym(p.d))})});

  $('#pg-sum').textContent=`${n} linhas · ${brl(grand)}`;

/* ----- planilha de uma tarefa (painel) ----- */
let MODAL_RENDER=null;const plExtra={a:0,b:0,tid:null};

function mesHeadRel(months,cur,S0,F0){return months.map(k=>`<th class="m rel ${k===cur?'cur':''} ${k>=S0&&k<=F0?'exh':''}"><b>${relLbl(k,S0)}</b><small>${ymLabel(k)}</small></th>`).join('')}
function openPlanilha(tid){const t0=byId(tid);if(!t0)return;if(plExtra.tid!==tid){plExtra.a=0;plExtra.b=0;plExtra.tid=tid;plExtra.all=false}
  modal(`<h2 id="pl-h"></h2><p>Por padrão o desembolso segue o físico (o que for executado em cada mês). Se a tarefa tiver um fluxo próprio, digite os valores nos meses: Mi − 1 é o mês antes do início, Mi + 1 o mês seguinte. Setas e Enter navegam como no Excel e dá para colar do Excel. Os valores andam junto se a tarefa mudar de data.</p>
    <div class="ledger-wrap" id="pl-grid" style="max-height:56vh"></div>

  r=>{r.querySelector('.acts').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;if(b.dataset.m==='x')return closeModal();if(b.dataset.m==='antes')plExtra.a++;if(b.dataset.m==='depois')plExtra.b++;if(b.dataset.m==='all')plExtra.all=!plExtra.all;MODAL_RENDER&&MODAL_RENDER()};

function mensalPart(t,c,D){const f=t.fin[c];const S0=ym(SC.S[t.id]),F0=ym(SC.F[t.id]);const mv=mesValores(t,c);let a=S0-1,b=F0+1;mv.forEach((v,k)=>{a=Math.min(a,k);b=Math.max(b,k)});const months=[];for(let k=a;k<=b;k++)months.push(k);const cur=ym(today());

/* ----- teclado e colar, estilo Excel ----- */
function mgMove(el,dr,dc){const td=el.closest('td'),tr=td.parentElement,tb=tr.closest('table');const rows=[...tb.querySelectorAll('tr')].filter(r=>r.querySelector('input.mc,input.mt'));

  if(dr){for(ri+=dr;ri>=0&&ri<rows.length;ri+=dr){const c=rows[ri].cells[ci];if(c&&go(c.querySelector('input.mc,input.mt')))return}return}
  for(ci+=dc;ci>=0&&ci<tr.cells.length;ci+=dc){if(go(tr.cells[ci].querySelector('input.mc,input.mt')))return}}
document.addEventListener('keydown',e=>{const el=e.target;if(!el.matches||!el.matches('table.mg input.mc, table.mg input.mt'))return;
  if(e.key==='Escape'){el.value=el.defaultValue;el.select();e.stopPropagation();return}
  const full=el.selectionStart===0&&el.selectionEnd===el.value.length;const k=e.key;let h=true;
  if(k==='ArrowDown'||(k==='Enter'&&!e.shiftKey))mgMove(el,1,0);
  else if(k==='ArrowUp'||(k==='Enter'&&e.shiftKey))mgMove(el,-1,0);
  else if(k==='ArrowRight'&&(full||el.selectionStart===el.value.length))mgMove(el,0,1);
  else if(k==='ArrowLeft'&&(full||el.selectionEnd===0))mgMove(el,0,-1);else h=false;
  if(h){e.preventDefault();e.stopPropagation()}},true);

  if(el.matches('table.mg input.mt')){e.stopPropagation();const v=parseMoney(el.value);mutate(()=>{const t=byId(el.dataset.tid);setTotal(t,el.dataset.c,v)})}},true);
document.addEventListener('paste',e=>{const el=e.target;if(!el.matches||!el.matches('table.mg input.mc'))return;const txt=(e.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(txt.trim()))return;e.preventDefault();
  const mat=txt.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(r=>r.split('\t'));const td=el.closest('td'),tr=td.parentElement,tb=tr.closest('table');const rows=[...tb.querySelectorAll('tr')].filter(r=>r.querySelector('input.mc'));
  const r0=rows.indexOf(tr),c0=td.cellIndex;const list=[];mat.forEach((row,ri)=>{const R=rows[r0+ri];if(!R)return;row.forEach((val,cj)=>{const cell=R.cells[c0+cj];const x=cell&&cell.querySelector('input.mc');if(x&&!x.disabled)list.push({tid:x.dataset.tid,c:x.dataset.c,k:+x.dataset.k,v:Math.max(0,parseNum(val))})})});
  setMesMany(list);toast(`${list.length} células coladas.`)});
</script>
<script>
/* ===================== modo pasta compartilhada (SharePoint/OneDrive sincronizado) =====================
   Cada usuário grava só no próprio arquivo dados-<login>.json dentro da pasta escolhida.
   Todos leem todos os arquivos da pasta e juntam documento a documento, ficando com a versão mais recente.
   Como cada arquivo tem um único autor, o OneDrive não gera conflitos entre pessoas. */
const DEF_MASTER={login:'master',senha:'master123'};
let FDB=null,EU=null,FOLDER_NAME='';
async function sha256(txt){try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  // implementação de reserva
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=[...new TextEncoder().encode(txt)];const l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(Math.floor(l/Math.pow(2,i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const R=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){const w=new Array(64);for(let i=0;i<16;i++)w[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];
    for(let i=16;i<64;i++){const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let [a,bb,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&bb)^(a&c)^(bb&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
    H=H.map((x,i)=>(x+[a,bb,c,d,e,f,g,h][i])|0)}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
const senhaHash=(salt,s)=>sha256(salt+'|'+s);
/* IndexedDB para lembrar a pasta escolhida */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('planejador-obras-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbSet(k,v){try{const d=await idb();await new Promise(r=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}}

function folderDB(dir){
  const fdb={dir,me:null,mine:{},src:{},docs:{},pending:false,lastRead:0,err:null,writing:false};
  const subs=new Set();const notify=()=>subs.forEach(s=>{try{s()}catch(e){}});
  const myName=()=>fdb.me?`dados-${fdb.me.replace(/[^a-z0-9_.-]/gi,'_')}.json`:null;
  function rebuild(){const best={};const take=ents=>{for(const p in ents){const e=ents[p];if(!e||typeof e.em!=='number')continue;if(!best[p]||e.em>best[p].em||(e.em===best[p].em&&JSON.stringify(e)>JSON.stringify(best[p])))best[p]=e}};
    Object.values(fdb.src).forEach(s=>take(s.entries));take(fdb.mine);const docs={};for(const p in best)if(!best[p].del)docs[p]=best[p].d;fdb.docs=docs}
  async function readAll(){let changed=false;const seen=new Set();
    for await(const [name,h] of dir.entries()){if(h.kind!=='file'||!/^dados-.*\.json$/i.test(name))continue;seen.add(name);
      try{const f=await h.getFile();const s=fdb.src[name];if(s&&s.lm===f.lastModified&&s.size===f.size)continue;const j=JSON.parse(await f.text());
        fdb.src[name]={lm:f.lastModified,size:f.size,entries:(j&&j.entries)||{}};changed=true;
        if(name===myName()){for(const p in fdb.src[name].entries){const e=fdb.src[name].entries[p];if(!fdb.mine[p]||e.em>fdb.mine[p].em)fdb.mine[p]=e}}}
      catch(e){/* arquivo sendo sincronizado: tenta na próxima leitura */}}
    Object.keys(fdb.src).forEach(n=>{if(!seen.has(n)){delete fdb.src[n];changed=true}});
    fdb.lastRead=Date.now();if(changed){rebuild();notify()}return changed}
  let ft=null;
  function put(p,e){fdb.mine[p]=e;rebuild();notify();if(!fdb.me)return;fdb.pending=true;renderSyncSafe();clearTimeout(ft);ft=setTimeout(flush,700)}
  async function flush(){if(!fdb.me)return;if(fdb.writing){clearTimeout(ft);ft=setTimeout(flush,400);return}fdb.writing=true;
    try{const name=myName();try{const h=await dir.getFileHandle(name);const f=await h.getFile();const j=JSON.parse(await f.text());const ents=(j&&j.entries)||{};for(const p in ents){if(!fdb.mine[p]||ents[p].em>fdb.mine[p].em)fdb.mine[p]=ents[p]}}catch(e){}
      const h=await dir.getFileHandle(name,{create:true});const w=await h.createWritable();
      await w.write(JSON.stringify({formato:'planejador-obras-pasta',versao:1,login:fdb.me,salvoEm:new Date().toISOString(),entries:fdb.mine}));await w.close();
      const f=await h.getFile();fdb.src[name]={lm:f.lastModified,size:f.size,entries:clone(fdb.mine)};fdb.pending=false;fdb.err=null}
    catch(e){fdb.err=e;toast('Não consegui gravar na pasta compartilhada. Verifique se ela está sincronizada e se você tem permissão.')}
    finally{fdb.writing=false;renderSyncSafe()}}
  setInterval(()=>{if(!document.hidden)readAll().catch(()=>{})},4000);
  window.addEventListener('beforeunload',e=>{if(fdb.pending){flush();e.preventDefault();e.returnValue=''}});
  const snap=p=>({id:p.split('/').pop(),exists:p in fdb.docs,data:()=>clone(fdb.docs[p]),metadata:{fromCache:false,hasPendingWrites:false}});
  const col=c=>{const n=c.split('/').length+1;return Object.keys(fdb.docs).filter(p=>p.startsWith(c+'/')&&p.split('/').length===n).sort().map(snap)};
  const docRef=p=>({path:p,id:p.split('/').pop(),get:async()=>snap(p),
    set:async b=>put(p,{em:Date.now(),d:clone(b)}),
    update:async b=>{if(!(p in fdb.docs))throw{code:'invalid_argument',message:'missing'};put(p,{em:Date.now(),d:deepMerge(fdb.docs[p],b)})},
    delete:async()=>put(p,{em:Date.now(),del:true}),
    onSnapshot:fn=>{const s=()=>fn(snap(p));subs.add(s);setTimeout(s,0);return()=>subs.delete(s)}});
  const colRef=c=>({path:c,doc:id=>docRef(c+'/'+id),get:async()=>{const d=col(c);return{docs:d,size:d.length,empty:!d.length}},
    onSnapshot:fn=>{const s=()=>{const d=col(c);fn({docs:d,size:d.length,empty:!d.length})};subs.add(s);setTimeout(s,0);return()=>subs.delete(s)}});
  return Object.assign(fdb,{readAll,flush,doc:docRef,collection:colRef,_all:()=>fdb.docs,setMe(l){fdb.me=l}})}
function renderSyncSafe(){try{renderSync()}catch(e){}}

/* ----- usuários e acessos ----- */
const PAPEIS_PROJ={admin:'Administrador do projeto',planejamento:'Planejamento (prazos e avanço)',financeiro:'Financeiro (valores e pagamentos)',campo:'Campo (avanço e comentários)',leitura:'Somente leitura'};
const usuarioDoc=l=>ADB&&ADB.docs['usuarios/'+l];
const acessoDe=(pid,l)=>{const u=usuarioDoc(l);const p=u&&u.acessos&&u.acessos[pid];if(PAPEIS_PROJ[p])return p;const a=ADB&&ADB.docs['projetos/'+pid+'/acesso/'+l];return a&&PAPEIS_PROJ[a.papel]?a.papel:null};
const LOGIN=()=>MODE==='arquivo'||MODE==='firebase';
function setAcesso(l,pid,papel){const u=clone(usuarioDoc(l)||{});u.acessos=Object.assign({},u.acessos||{});if(papel)u.acessos[pid]=papel;else delete u.acessos[pid];const pr=ADB.doc('usuarios/'+l).set(u);if(ADB.docs['projetos/'+pid+'/acesso/'+l])ADB.doc('projetos/'+pid+'/acesso/'+l).delete().catch(()=>{});refiltrarProjs();return pr.catch(e=>toast('Não consegui salvar o acesso: '+(e.message||e.code)))}
function temAcesso(pid){if(!LOGIN())return true;if(!EU)return false;return EU.master||!!acessoDe(pid,EU.login)}
function papelArquivo(){if(!EU)return'leitura';if(EU.master)return'admin';return(ui.pid&&acessoDe(ui.pid,EU.login))||'leitura'}
function usuariosLista(){if(!ADB||!ADB.docs)return[];return Object.keys(ADB.docs).filter(p=>/^usuarios\/[^/]+$/.test(p)).map(p=>({login:p.split('/')[1],...ADB.docs[p]})).sort((a,b)=>(a.nome||a.login).localeCompare(b.nome||b.login))}
function iniciaisAvatar(nome){const ini=(nome||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('');let h=0;for(const ch of nome||'')h=(h*31+ch.charCodeAt(0))%360;
  return'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" rx="20" fill="hsl(${h},45%,45%)"/><text x="20" y="25" font-family="Arial" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">${ini}</text></svg>`)}
function syncPerfis(){usuariosLista().forEach(u=>peerProf[u.login]={id:u.login,name:u.nome||u.login,avatarUrl:iniciaisAvatar(u.nome||u.login)});PEOPLE=usuariosLista().filter(u=>u.ativo!==false).map(u=>u.nome||u.login)}

async function tentarLogin(login,senha){login=String(login||'').trim().toLowerCase();if(!login||!senha)throw new Error('Informe usuário e senha.');
  const u=usuarioDoc(login),s=ADB.docs['senhas/'+login];
  if(!u&&login===DEF_MASTER.login&&!usuariosLista().some(x=>x.master)){if(senha!==DEF_MASTER.senha&&senha!=='master 123')throw new Error('Senha incorreta.');
    ADB.setMe(login);const salt=nid();await ADB.doc('usuarios/'+login).set({nome:'Administrador',master:true,podeCriar:true,ativo:true,criadoEm:Date.now()});await ADB.doc('senhas/'+login).set({salt,hash:await senhaHash(salt,senha),trocar:true});return login}
  if(!u||!s)throw new Error('Usuário não encontrado.');if(u.ativo===false)throw new Error('Este usuário está desativado. Fale com o administrador.');
  if(await senhaHash(s.salt,senha)!==s.hash)throw new Error('Senha incorreta.');return login}
function entrar(login){const u=usuarioDoc(login)||{};ADB.setMe(login);EU={login,nome:u.nome||login,master:!!u.master,podeCriar:!!(u.master||u.podeCriar)};ME={id:login,name:EU.nome};syncPerfis();
  try{localStorage.setItem('planejador-obras-sessao',JSON.stringify({login,h:(ADB.docs['senhas/'+login]||{}).hash||''}))}catch(e){}
  $('#v-login').hidden=true;startApp();const s=ADB.docs['senhas/'+login];if(s&&s.trocar)setTimeout(()=>openTrocarSenha(true),300)}
function sair(){try{localStorage.removeItem('planejador-obras-sessao')}catch(e){}if(ADB&&ADB.pending)ADB.flush();location.reload()}
function renderUserChip(){const el=$('#user-chip');if(!el)return;if(!LOGIN()||!EU){el.hidden=true;return}el.hidden=false;
  el.innerHTML=`<img src="${iniciaisAvatar(EU.nome)}" alt=""><span>${esc(EU.nome)}${EU.master?' · master':''}</span>`}
function openUserMenu(){const r=$('#user-chip').getBoundingClientRect();
  $('#menu-root').innerHTML=`<div class="menu" style="left:${Math.max(16,Math.min(r.left,window.innerWidth-300))}px;top:${r.bottom+6}px"><div class="mh">${esc(EU.nome)} (${esc(EU.login)})</div>
    <button class="mi" data-u="senha">Trocar minha senha</button>${EU.master?'<button class="mi" data-u="usuarios">Usuários e acessos</button>':''}<button class="mi" data-u="pasta">${MODE==='firebase'?'Banco: Firebase ('+esc(FIREBASE_CFG.projectId)+')':'Pasta de dados: '+esc(FOLDER_NAME)}</button><hr><button class="mi" data-u="sair">Sair</button></div>`;
  $('#menu-root .menu').onclick=e=>{const b=e.target.closest('[data-u]');if(!b)return;closeMenu();({senha:()=>openTrocarSenha(false),usuarios:openUsuarios,sair,pasta:()=>toast(MODE==='firebase'?'Os dados ficam no Firebase, em planejador/v1, separados do sistema de Compras.':'Os dados ficam nos arquivos dados-*.json da pasta “'+FOLDER_NAME+'”.')})[b.dataset.u]()}}
function openTrocarSenha(obrig){modal(`<h2>${obrig?'Crie uma senha nova':'Trocar minha senha'}</h2>${obrig?'<p>Você entrou com a senha inicial. Defina uma senha só sua antes de continuar.</p>':''}
  <div class="row2"><label class="lbl">Nova senha<input class="inp" type="password" id="ns1" autocomplete="new-password"></label><label class="lbl">Repita a senha<input class="inp" type="password" id="ns2" autocomplete="new-password"></label></div>
  <div class="acts">${obrig?'':'<button class="btn" data-m="x">Cancelar</button>'}<button class="btn primary" data-m="ok">Salvar senha</button></div>`,
  r=>r.querySelector('.acts').onclick=async e=>{const b=e.target.closest('[data-m]');if(!b)return;if(b.dataset.m==='x')return closeModal();
    const a=r.querySelector('#ns1').value,c=r.querySelector('#ns2').value;if(a.length<6){toast('Use pelo menos 6 caracteres.');return}if(a!==c){toast('As senhas não conferem.');return}
    const salt=nid();await ADB.doc('senhas/'+EU.login).set({salt,hash:await senhaHash(salt,a),trocar:false});try{localStorage.setItem('planejador-obras-sessao',JSON.stringify({login:EU.login,h:ADB.docs['senhas/'+EU.login].hash}))}catch(_){}closeModal();toast('Senha alterada.')})}
function openUsuarios(){if(!EU||!EU.master)return;const projs=[...remote.projs.entries()].concat(Object.keys(ADB.docs).filter(p=>/^projetos\/[^/]+$/.test(p)&&!remote.projs.has(p.split('/')[1])).map(p=>[p.split('/')[1],ADB.docs[p]]));
  const draw=()=>{const us=usuariosLista();const pid=$('#us-proj')?$('#us-proj').value:(ui.pid||'');
    $('#us-body').innerHTML=`<table class="cmp-t"><thead><tr><th>Usuário</th><th>Nome</th><th>Situação</th><th>Pode criar projetos</th><th>Acesso ao projeto selecionado</th><th></th></tr></thead><tbody>
      ${us.map(u=>`<tr data-l="${esc(u.login)}"><td style="text-align:left">${esc(u.login)}${u.master?' <span class="pill run">master</span>':''}</td><td style="text-align:left"><input class="inp" data-uf="nome" value="${esc(u.nome||'')}" style="height:30px"></td>
        <td style="text-align:left"><select class="inp" data-uf="ativo" style="height:30px" ${u.login===EU.login?'disabled':''}><option value="1" ${u.ativo!==false?'selected':''}>Ativo</option><option value="0" ${u.ativo===false?'selected':''}>Desativado</option></select></td>
        <td style="text-align:left"><input type="checkbox" data-uf="podeCriar" ${u.master||u.podeCriar?'checked':''} ${u.master?'disabled':''}></td>
        <td style="text-align:left">${u.master?'<span class="mut">acesso total</span>':pid?`<select class="inp" data-uf="acesso" style="height:30px"><option value="">Sem acesso</option>${Object.entries(PAPEIS_PROJ).map(([k,v])=>`<option value="${k}" ${acessoDe(pid,u.login)===k?'selected':''}>${v}</option>`).join('')}</select>`:'—'}</td>
        <td><button class="btn sm ghost" data-ua="reset">Nova senha</button></td></tr>`).join('')}</tbody></table>`};
  modal(`<h2>Usuários e acessos</h2><p>Crie usuários, defina quem pode criar projetos e o papel de cada pessoa em cada projeto. Quem não tiver acesso não vê o projeto.</p>
    <div class="row2" style="align-items:end"><label class="lbl">Projeto<select class="inp" id="us-proj">${projs.map(([id,m])=>`<option value="${id}" ${id===ui.pid?'selected':''}>${esc((m&&m.nome)||'Projeto')}</option>`).join('')}</select></label></div>
    <div id="us-body" style="overflow:auto;max-height:46vh"></div>
    <h2 style="font-size:15px">Novo usuário</h2><div class="row2" style="align-items:end"><label class="lbl">Login<input class="inp" id="nu-l" placeholder="ex.: joao.silva" autocomplete="off"></label><label class="lbl">Nome<input class="inp" id="nu-n" autocomplete="off"></label><label class="lbl">Senha inicial<input class="inp" id="nu-s" autocomplete="off" placeholder="mínimo 6 caracteres"></label><label class="ck" style="margin:0 0 8px"><input type="checkbox" id="nu-m">Master</label><button class="btn primary" data-m="novo" style="height:34px">Criar usuário</button></div>
    <p>A pessoa troca a senha inicial no primeiro acesso.</p><div class="acts">${MODE==='firebase'?'<button class="btn" data-m="compras">Trazer usuários do sistema de Compras</button>':''}<button class="btn" data-m="x">Fechar</button></div>`,
  r=>{draw();r.querySelector('#us-proj').onchange=draw;
    r.querySelector('#us-body').addEventListener('change',async e=>{const el=e.target,tr=el.closest('tr[data-l]');if(!tr)return;const l=tr.dataset.l,f=el.dataset.uf;const u=clone(usuarioDoc(l)||{});
      if(f==='nome'){u.nome=el.value.trim()||l;await ADB.doc('usuarios/'+l).set(u)}if(f==='ativo'){u.ativo=el.value==='1';await ADB.doc('usuarios/'+l).set(u)}if(f==='podeCriar'){u.podeCriar=el.checked;await ADB.doc('usuarios/'+l).set(u)}
      if(f==='acesso'){const pid=r.querySelector('#us-proj').value;await setAcesso(l,pid,el.value)}
      syncPerfis();toast('Salvo.')});
    r.querySelector('.modal').addEventListener('click',async e=>{const b=e.target.closest('[data-m],[data-ua]');if(!b)return;
      if(b.dataset.m==='x')return closeModal();
      if(b.dataset.m==='compras'){b.disabled=true;await importarUsuariosCompras();b.disabled=false;draw();return}
      if(b.dataset.ua==='reset'){const l=b.closest('tr').dataset.l;const nova=Math.random().toString(36).slice(2,8);const salt=nid();await ADB.doc('senhas/'+l).set({salt,hash:await senhaHash(salt,nova),trocar:true});openText('Senha provisória','Passe esta senha para '+l+'. Ela será trocada no primeiro acesso.',nova);return}
      if(b.dataset.m==='novo'){const l=r.querySelector('#nu-l').value.trim().toLowerCase(),n=r.querySelector('#nu-n').value.trim(),s=r.querySelector('#nu-s').value,m=r.querySelector('#nu-m').checked;
        if(!/^[a-z0-9_.-]{3,40}$/.test(l)){toast('Login com 3 a 40 letras, números, ponto, hífen ou _.');return}if(usuarioDoc(l)){toast('Esse login já existe.');return}if(s.length<6){toast('A senha inicial precisa de 6 caracteres ou mais.');return}

    if(a==='fix100'){if(!f.parcelas.length)f.parcelas.push({pct:0,ref:'termino',offset:0});const s=sum(f.parcelas.slice(0,-1).map(p=>+p.pct||0));f.parcelas[f.parcelas.length-1].pct=Math.max(0,Math.round((100-s)*1e4)/1e4)}})});

$('#ledger').addEventListener('change',e=>{const el=e.target,tr=el.closest('tr[data-tid]');if(!tr||!el.dataset.f)return;const id=tr.dataset.tid,f=el.dataset.f;
  if(ui.pagView==='tarefas'){const c=el.dataset.c;mutate(()=>{const t=byId(id),x=t.fin[c];
    if(f==='valor')setTotal(t,c,parseMoney(el.value));if(f==='qtd')setQtdPu(x,Math.max(0,parseNum(el.value)),x.pu);if(f==='pu')setQtdPu(x,x.qtd,parseMoney(el.value));if(f==='un')x.un=el.value.trim();
    if(f==='base'){if(el.value==='mensal')toMensal(t,c);else if(el.value==='fisico')x.modo='fisico';else if(el.value==='medicao')x.modo='medicao';else{x.modo='cond';x.base=el.value}}
    if(f==='prazo'){if(x.modo==='medicao'){const n=parseInt(el.value,10);if(isNaN(n))throw new Error('Informe quantos dias após o fim do mês (ex.: 15).');x.offset=n}else{parsePrazo(el.value);x.prazo=el.value.trim()||'0'}}});return}
  const c=tr.dataset.c,j=+tr.dataset.i;
  mutate(()=>{const t=byId(id);
    if(f==='pago'){const p=pagamentos(t).find(x=>x.c===c&&x.i===j);setPago(t,c,j,el.checked,d2iso(Math.min(p?p.d:today(),today())),p?p.v:0);return}
    const fx=t.fin[c];if(fx.modo==='mensal'){const S0=ym(SC.S[id]);const rel=j-1000;
      if(f==='data'){const d=readDate(el.value,SC.S[id]);if(d==null)throw new Error('Informe a data do pagamento.');const nr=ym(d)-S0;if(nr!==rel){const v=+fx.mens[rel]||0;delete fx.mens[rel];fx.mens[nr]=r2((+fx.mens[nr]||0)+v);fx.pagos=fx.pagos.filter(p=>p.i!==1000+nr).map(p=>p.i===j?{...p,i:1000+nr}:p)}}
      if(f==='valor'){const v=parseMoney(el.value);if(v>0)fx.mens[rel]=v;else delete fx.mens[rel]}setValor(fx,mensSum(fx));return}
    ensureManual(t,c);
    if(f==='data'){const d=readDate(el.value,SC.S[id]);if(d==null)throw new Error('Informe a data do pagamento.');setParcDate(t,c,j,d)}
    if(f==='valor')setParcValor(t,c,j,parseMoney(el.value))})});
$('#ledger').addEventListener('keydown',e=>{const el=e.target;if(e.key!=='Enter'||el.tagName!=='INPUT')return;const tr=el.closest('tr[data-tid]');if(!tr)return;e.preventDefault();
  const sel=el.dataset.c?`[data-f="${el.dataset.f}"][data-c="${el.dataset.c}"]`:`[data-f="${el.dataset.f}"]`;const tid=tr.dataset.tid,ti=tr.dataset.i,tc=tr.dataset.c;el.blur();

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(DP){dpClose();return}if($('#menu-root').innerHTML)closeMenu();else if($('#modal-root').innerHTML)closeModal();else if(ui.open){ui.open=false;presence();render()}return}
  if($('#modal-root').innerHTML||ui.view!=='cron'||!state)return;
  const tag=(e.target.tagName||'').toLowerCase(),typing=['input','textarea','select'].includes(tag);
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();actions.add();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();undo();return}
  if(e.altKey&&!e.ctrlKey){const m={ArrowRight:'indent',ArrowLeft:'outdent',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();actions[m]()}}});

function refiltrarProjs(){if(!remote.projsAll||!STORE)return;remote.projs=new Map([...remote.projsAll].filter(([id])=>temAcesso(id)));
  const known=id=>remote.projs.has(id)||pend.has('projetos/'+id)||inflight.has('projetos/'+id);
  if(!ui.pid||!known(ui.pid)){const first=[...remote.projs.entries()].sort((a,b)=>(a[1].cenarioDe?1:0)-(b[1].cenarioDe?1:0)||(b[1].atualizadoEm||0)-(a[1].atualizadoEm||0))[0];abrirProjeto(first?first[0]:null)}
  else if(!subT)abrirProjeto(ui.pid);
  scheduleRender()}
function startApp(){
  if(MODE==='local'&&oldData&&!Object.keys(STORE._all()).length){try{importJSON(JSON.stringify(oldData));localStorage.removeItem(OLDKEY);oldData=null}catch(e){}}
  STORE.collection('projetos').onSnapshot(s=>{if(LOGIN())syncPerfis();remote.projsAll=new Map(s.docs.map(d=>[d.id,d.data()]));remote.loadedP=true;refiltrarProjs()},e=>{MODE='local';toast('Não consegui abrir o banco compartilhado.');scheduleRender()});
  STORE.collection('modelos').onSnapshot(s=>{remote.modelos=new Map(s.docs.map(d=>[d.id,d.data()]))},()=>{});
  if(MODE==='nuvem')STORE.doc('config/papeis').onSnapshot(d=>{remote.papeis=(d.exists&&d.data().map)||{};scheduleRender()},()=>{});
  scheduleRender()}
(async()=>{
  const [db,user,room,dl,assets]=await Promise.all([use('db'),use('user'),use('room'),use('downloads'),use('assets')]);

    try{await initFirebase();MODE='firebase';$('#v-load').hidden=true;aposConectar();return}

  if(user){try{ME=await user.me()}catch(e){}try{CANEDIT=!!(await user.canEdit())}catch(e){}if(MODE==='nuvem'){try{const w=await user.can('data.write');if(w===false)setRO(true)}catch(e){}}
    try{const ps=await user.search('');PEOPLE=(ps||[]).map(p=>p.name).filter(Boolean);ps.forEach(p=>peerProf[p.id]=p)}catch(e){}}
  startApp();
  if(room){ROOM=room;try{room.onPeers(ch=>{peers=ch.peers.slice();scheduleRender()},()=>{});presence()}catch(e){}}
})();
